<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <!-- Runebound banner (GitHub social preview / itch.io / store header): night sky, floating hub, portal, logo -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070c"/>
      <stop offset=".55" stop-color="#0d1f2a"/>
      <stop offset="1" stop-color="#123236"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="58%" r="45%">
      <stop offset="0" stop-color="#3fd6c6" stop-opacity=".35"/>
      <stop offset="1" stop-color="#3fd6c6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="portal" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e8fffb"/>
      <stop offset=".35" stop-color="#5af0dc"/>
      <stop offset="1" stop-color="#0c6a63" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1a8"/>
      <stop offset=".5" stop-color="#ffcf3a"/>
      <stop offset="1" stop-color="#a86f00"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4752"/>
      <stop offset="1" stop-color="#1a232b"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feFlood flood-color="#3fd6c6" flood-opacity=".6"/>
      <feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#sky)"/>
  <!-- stars -->
  <g fill="#cfeee9">
    <circle cx="90" cy="70" r="1.6"/><circle cx="210" cy="140" r="1.2"/><circle cx="330" cy="50" r="1.8"/><circle cx="470" cy="110" r="1.1"/>
    <circle cx="610" cy="40" r="1.4"/><circle cx="760" cy="90" r="1.2"/><circle cx="880" cy="30" r="1.7"/><circle cx="1010" cy="120" r="1.3"/>
    <circle cx="1150" cy="60" r="1.9"/><circle cx="1230" cy="170" r="1.1"/><circle cx="60" cy="220" r="1.2"/><circle cx="1200" cy="260" r="1.4"/>
  </g>
  <!-- rune sea ribbon in the sky -->
  <path d="M-20 200C200 140 380 250 640 190S1080 120 1300 180" fill="none" stroke="#3fd6c6" stroke-opacity=".25" stroke-width="22" filter="url(#soft)"/>
  <!-- far mountains -->
  <path d="M0 470 120 380 220 430 340 330 470 420 560 370 640 420 760 340 880 410 990 350 1120 430 1280 360V640H0Z" fill="#0a161d"/>
  <ellipse cx="640" cy="400" rx="560" ry="240" fill="url(#aura)"/>
  <!-- floating hub island -->
  <path d="M370 470Q640 400 910 470L840 560Q640 640 440 560Z" fill="#0f1a20"/>
  <ellipse cx="640" cy="468" rx="272" ry="62" fill="url(#stone)" stroke="#3fd6c6" stroke-opacity=".5" stroke-width="2"/>
  <ellipse cx="640" cy="468" rx="190" ry="40" fill="none" stroke="#3fd6c6" stroke-width="3" stroke-dasharray="5 11" opacity=".8"/>
  <!-- braziers -->
  <g fill="#ffb347"><ellipse cx="420" cy="452" rx="7" ry="11"/><ellipse cx="860" cy="452" rx="7" ry="11"/></g>
  <g fill="#ffb347" opacity=".5" filter="url(#soft)"><circle cx="420" cy="448" r="22"/><circle cx="860" cy="448" r="22"/></g>
  <!-- portal arch -->
  <path d="M572 452V352Q640 286 708 352V452" fill="none" stroke="url(#stone)" stroke-width="22" stroke-linecap="round"/>
  <ellipse cx="640" cy="400" rx="50" ry="62" fill="url(#portal)"/>
  <ellipse cx="640" cy="400" rx="70" ry="84" fill="#5af0dc" opacity=".25" filter="url(#soft)"/>
  <!-- three heroes: tank (blue), dps (red), healer (green) -->
  <g stroke="#0b1218" stroke-width="3">
    <circle cx="582" cy="478" r="13" fill="#4da3ff"/>
    <circle cx="640" cy="488" r="13" fill="#ff5a5a"/>
    <circle cx="698" cy="478" r="13" fill="#5dff8a"/>
  </g>
  <!-- logo -->
  <g filter="url(#glow)">
    <path d="M330 118 392 180 330 242 268 180Z" fill="#120d05" stroke="url(#gold)" stroke-width="7" stroke-linejoin="round"/>
    <path d="M318 150v60M318 152h13c12 0 16 6 16 14s-4 14-16 14h-13M330 180l20 30" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="418" y="212" font-family="Cinzel, 'Trajan Pro', Georgia, 'Times New Roman', serif" font-weight="700" font-size="88" letter-spacing="10" fill="url(#gold)" stroke="#3a2600" stroke-width="2">RUNEBOUND</text>
  </g>
  <text x="640" y="276" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="26" letter-spacing="5" fill="#9fe8df">Tank · DPS · Healer — raid as one</text>
</svg>
