<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <!-- Runebound hub: top-down guild inn. 900x600 game space. Keeps the portal (top center, gateway at 450,140).
       NPC rugs sit exactly on the NPC spots used in index.html. Render: tools render-assets (headless Edge). -->
  <defs>
    <!-- wood floor planks -->
    <pattern id="planks" width="120" height="44" patternUnits="userSpaceOnUse">
      <rect width="120" height="22" fill="#5b3b23"/>
      <rect y="22" width="120" height="22" fill="#644128"/>
      <path d="M0 22h120M0 44h120" stroke="#2e1d10" stroke-width="2"/>
      <path d="M78 0v22M24 22v22M104 22v22" stroke="#2e1d10" stroke-width="1.6"/>
      <path d="M8 8q20 3 40 0M60 15q25 -3 50 0M10 31q30 3 60 0M80 37q15 -2 30 0" stroke="#4b2f1b" stroke-width="1" fill="none" opacity=".7"/>
    </pattern>
    <!-- stone wall blocks -->
    <pattern id="stone" width="60" height="30" patternUnits="userSpaceOnUse">
      <rect width="60" height="30" fill="#3b3833"/>
      <path d="M0 15h60M0 30h60M30 0v15M0 15v15M60 15v15" stroke="#24221f" stroke-width="2"/>
      <rect x="3" y="3" width="24" height="9" fill="#45413b" opacity=".6"/>
      <rect x="33" y="18" width="24" height="9" fill="#45413b" opacity=".5"/>
    </pattern>
    <radialGradient id="warm" cx="50%" cy="55%" r="60%">
      <stop offset="0" stop-color="#ffb35c" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffb35c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fire" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd27a" stop-opacity=".85"/>
      <stop offset=".4" stop-color="#ff8a2a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ff6a00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gate" cx="50%" cy="55%" r="55%">
      <stop offset="0" stop-color="#e8fffb"/>
      <stop offset=".35" stop-color="#5af0dc"/>
      <stop offset="1" stop-color="#0c4d48"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="52%" r="62%">
      <stop offset=".6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".75"/>
    </radialGradient>
    <radialGradient id="rug" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6e2630"/>
      <stop offset=".8" stop-color="#4a161d"/>
      <stop offset="1" stop-color="#3a1016"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a5232"/>
      <stop offset="1" stop-color="#4e321c"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity=".55"/></filter>
  </defs>

  <!-- outside + walls + floor -->
  <rect width="900" height="600" fill="#0b131b"/>
  <rect x="58" y="58" width="784" height="530" rx="14" fill="url(#stone)"/>
  <rect x="86" y="86" width="728" height="474" fill="url(#planks)"/>
  <rect x="86" y="86" width="728" height="474" fill="none" stroke="#1a120a" stroke-width="6"/>
  <rect x="86" y="86" width="728" height="474" fill="url(#warm)"/>

  <!-- center rug with rune ring (the gathering circle) -->
  <g filter="url(#shadow)">
    <circle cx="450" cy="335" r="150" fill="url(#rug)"/>
  </g>
  <circle cx="450" cy="335" r="150" fill="none" stroke="#c99a3a" stroke-width="5"/>
  <circle cx="450" cy="335" r="138" fill="none" stroke="#c99a3a" stroke-width="1.5" opacity=".7"/>
  <circle cx="450" cy="335" r="118" fill="none" stroke="#3fd6c6" stroke-width="2.5" stroke-dasharray="3 9" opacity=".8"/>
  <circle cx="450" cy="335" r="60" fill="none" stroke="#c99a3a" stroke-width="2" opacity=".6"/>
  <path d="M450 285 488 335 450 385 412 335Z" fill="none" stroke="#3fd6c6" stroke-width="2.5" opacity=".75"/>
  <g stroke="#c99a3a" stroke-width="3" opacity=".55">
    <path d="M450 197v14M450 459v14M312 335h14M574 335h14M352 237l10 10M538 423l10 10M548 237l-10 10M362 423l-10 10"/>
  </g>

  <!-- portal set in the top wall (kept) -->
  <g filter="url(#shadow)">
    <path d="M384 196V110q0-62 66-62t66 62v86h-22v-84q0-40-44-40t-44 40v84z" fill="#4a4740" stroke="#24221f" stroke-width="3"/>
    <path d="M394 108q0-48 56-48t56 48" fill="none" stroke="#6e6a60" stroke-width="4"/>
    <path d="M440 46h20l-4 14h-12z" fill="#3fd6c6" opacity=".9"/>
  </g>
  <path d="M406 196v-84q0-40 44-40t44 40v84z" fill="url(#gate)"/>
  <ellipse cx="450" cy="140" rx="48" ry="62" fill="#5af0dc" opacity=".25" filter="url(#soft)"/>
  <ellipse cx="450" cy="200" rx="62" ry="12" fill="none" stroke="#3fd6c6" stroke-width="2" stroke-dasharray="4 6" opacity=".8"/>

  <!-- banners on the top wall -->
  <g filter="url(#shadow)">
    <path d="M300 62h34v52l-17-10-17 10z" fill="#1d7f78" stroke="#c99a3a" stroke-width="2"/>
    <path d="M566 62h34v52l-17-10-17 10z" fill="#7a2230" stroke="#c99a3a" stroke-width="2"/>
  </g>
  <path d="M317 76l6 10-6 10-6-10z" fill="#ffd84a"/>
  <path d="M583 76l6 10-6 10-6-10z" fill="#ffd84a"/>


  <!-- QUEST BOARD (left wall, interactive at 118,215) -->
  <g filter="url(#shadow)">
    <rect x="86" y="178" width="66" height="78" rx="4" fill="url(#wood)" stroke="#2e1d10" stroke-width="3"/>
    <rect x="92" y="186" width="24" height="30" fill="#efe0b4" transform="rotate(-5 104 201)"/>
    <rect x="120" y="184" width="26" height="24" fill="#f4e8c8"/>
    <rect x="96" y="220" width="22" height="28" fill="#e6d29c" transform="rotate(4 107 234)"/>
    <rect x="122" y="214" width="24" height="32" fill="#efe0b4"/>
    <g fill="#b0302f"><circle cx="104" cy="188" r="2.2"/><circle cx="133" cy="186" r="2.2"/><circle cx="107" cy="222" r="2.2"/><circle cx="134" cy="216" r="2.2"/></g>
    <g stroke="#6b5a3a" stroke-width="1.2" opacity=".8"><path d="M124 192h18M124 197h14M126 222h16M126 228h12M126 234h15"/></g>
  </g>
  <path d="M100 168h38l-6 10h-26z" fill="#c99a3a"/>
  <!-- GUILD BOARD (right wall, interactive at 782,215) with guild crest -->
  <g filter="url(#shadow)">
    <rect x="748" y="178" width="66" height="78" rx="4" fill="#3a2a4a" stroke="#c99a3a" stroke-width="3"/>
    <path d="M781 188l18 6v14c0 14-9 20-18 24-9-4-18-10-18-24v-14z" fill="#1d7f78" stroke="#ffd84a" stroke-width="2.5"/>
    <path d="M781 198l7 10-7 10-7-10z" fill="#ffd84a"/>
    <rect x="756" y="236" width="50" height="12" rx="2" fill="#efe0b4"/>
  </g>
  <path d="M762 168h38l-6 10h-26z" fill="#c99a3a"/>
  <!-- weapon rack (top-left) + trophy shield (top-right) -->
  <g filter="url(#shadow)">
    <rect x="160" y="70" width="80" height="12" rx="3" fill="url(#wood)" stroke="#2e1d10" stroke-width="2"/>
    <path d="M176 66l4 34M200 64v38M224 66l-4 34" stroke="#9aa6b2" stroke-width="4" stroke-linecap="round"/>
    <path d="M196 64h8M172 68l8-2M220 66l8 2" stroke="#c99a3a" stroke-width="3"/>
    <path d="M690 66l20 6v12c0 12-10 18-20 21-10-3-20-9-20-21v-12z" fill="#55595e" stroke="#c99a3a" stroke-width="2.5"/>
    <path d="M682 80l8 6 8-6M686 92h8" stroke="#ff4d8d" stroke-width="2.5" fill="none"/>
  </g>  <!-- fireplace (left wall) -->
  <ellipse cx="96" cy="370" rx="70" ry="80" fill="url(#fire)"/>
  <g filter="url(#shadow)">
    <rect x="58" y="325" width="40" height="90" fill="#2a2724" stroke="#1a1816" stroke-width="3"/>
    <rect x="66" y="337" width="26" height="66" fill="#140c08"/>
  </g>
  <path d="M74 395q4-22 10-14q2-16 8-6q4 10 0 20z" fill="#ffb347"/>
  <path d="M78 395q3-12 7-8q3 6 0 8z" fill="#fff1a8"/>

  <!-- bar counter (right wall) with mugs -->
  <g filter="url(#shadow)">
    <rect x="770" y="300" width="34" height="200" rx="4" fill="url(#wood)" stroke="#2e1d10" stroke-width="2"/>
  </g>
  <g fill="#c9a24a" stroke="#6b4b18" stroke-width="1.5">
    <circle cx="787" cy="330" r="6"/><circle cx="787" cy="370" r="6"/><circle cx="787" cy="432" r="6"/><circle cx="787" cy="470" r="6"/>
  </g>
  <g fill="#f4ecd8" opacity=".85"><circle cx="787" cy="330" r="3"/><circle cx="787" cy="432" r="3"/></g>

  <!-- long tables with benches and mugs -->
  <g filter="url(#shadow)">
    <rect x="120" y="478" width="120" height="34" rx="4" fill="url(#wood)" stroke="#2e1d10" stroke-width="2"/>
    <rect x="660" y="478" width="120" height="34" rx="4" fill="url(#wood)" stroke="#2e1d10" stroke-width="2"/>
  </g>
  <g fill="#3d2716"><rect x="124" y="466" width="112" height="8" rx="3"/><rect x="124" y="516" width="112" height="8" rx="3"/><rect x="664" y="466" width="112" height="8" rx="3"/><rect x="664" y="516" width="112" height="8" rx="3"/></g>
  <g fill="#c9a24a" stroke="#6b4b18" stroke-width="1.2">
    <circle cx="150" cy="495" r="5"/><circle cx="200" cy="492" r="5"/><circle cx="700" cy="495" r="5"/><circle cx="748" cy="490" r="5"/>
  </g>
  <rect x="172" y="486" width="16" height="12" rx="2" fill="#e8d6a0"/>

  <!-- barrels -->
  <g filter="url(#shadow)">
    <circle cx="116" cy="118" r="18" fill="#6b4626" stroke="#2e1d10" stroke-width="3"/>
    <circle cx="150" cy="126" r="14" fill="#6b4626" stroke="#2e1d10" stroke-width="3"/>
    <circle cx="784" cy="118" r="18" fill="#6b4626" stroke="#2e1d10" stroke-width="3"/>
    <circle cx="784" cy="530" r="16" fill="#6b4626" stroke="#2e1d10" stroke-width="3"/>
  </g>
  <g fill="none" stroke="#8a8a8a" stroke-width="1.5" opacity=".7">
    <circle cx="116" cy="118" r="12"/><circle cx="150" cy="126" r="9"/><circle cx="784" cy="118" r="12"/><circle cx="784" cy="530" r="10"/>
  </g>

  <!-- anvil near the Smith, bookshelf near the Archivist -->
  <g filter="url(#shadow)">
    <path d="M218 158h34q6 0 6 6h-8v6l6 8h-36l6-8v-6h-8q-2-6 0-6z" fill="#55595e" stroke="#2a2c2f" stroke-width="2"/>
    <rect x="92" y="430" width="22" height="80" fill="url(#wood)" stroke="#2e1d10" stroke-width="2"/>
  </g>
  <g><rect x="95" y="406" width="16" height="10" fill="#7a2230"/><rect x="95" y="420" width="16" height="12" fill="#1d7f78"/><rect x="95" y="436" width="16" height="9" fill="#c99a3a"/><rect x="95" y="452" width="16" height="14" fill="#4a3a7a"/><rect x="95" y="470" width="16" height="10" fill="#7a2230"/><rect x="95" y="486" width="16" height="16" fill="#2e5c3a"/></g>



  <!-- mercenary counter (Class Master, right side under the Guild Board) -->
  <g filter="url(#shadow)">
    <rect x="680" y="262" width="90" height="18" rx="3" fill="url(#wood)" stroke="#2e1d10" stroke-width="2"/>
    <rect x="690" y="258" width="14" height="10" fill="#efe0b4"/><rect x="740" y="257" width="18" height="12" fill="#e6d29c"/>
    <path d="M718 254l6 10-6 10-6-10z" fill="#5dff8a" opacity=".8"/>
  </g>
  <!-- merchant stall by the front door (bottom wall) -->
  <g filter="url(#shadow)">
    <rect x="404" y="552" width="92" height="36" rx="4" fill="#2a1a10" stroke="#c99a3a" stroke-width="2"/>
    <path d="M410 552q40-14 80 0" fill="none" stroke="#c99a3a" stroke-width="3"/>
    <rect x="380" y="528" width="140" height="16" rx="3" fill="url(#wood)" stroke="#2e1d10" stroke-width="2"/>
    <g fill="#ffcf4d"><circle cx="398" cy="536" r="4"/><circle cx="408" cy="534" r="3"/><circle cx="500" cy="536" r="4"/></g>
    <rect x="430" y="530" width="16" height="10" fill="#7a2230"/><rect x="452" y="530" width="14" height="10" fill="#1d7f78"/>
  </g>
  <!-- warm light pools: fireplace corner, bar, tables -->
  <g filter="url(#soft)" opacity=".5">
    <circle cx="160" cy="370" r="60" fill="#ffb35c" opacity=".25"/>
    <circle cx="740" cy="400" r="50" fill="#ffb35c" opacity=".2"/>
  </g>  <!-- vignette -->
  <rect width="900" height="600" fill="url(#vig)"/>
</svg>
