<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <!-- Runebound hub: cozy guild inn. 900x600 game space. Portal top center. -->
  <defs>
    <pattern id="planks" width="120" height="44" patternUnits="userSpaceOnUse">
      <rect width="120" height="22" fill="#5b3b23"/><rect y="22" width="120" height="22" fill="#644128"/>
      <path d="M0 22h120M0 44h120" stroke="#2e1d10" stroke-width="2"/><path d="M78 0v22M24 22v22M104 22v22" stroke="#2e1d10" stroke-width="1.6"/>
    </pattern>
    <pattern id="stone" width="60" height="30" patternUnits="userSpaceOnUse">
      <rect width="60" height="30" fill="#3b3833"/><path d="M0 15h60M0 30h60M30 0v15M0 15v15M60 15v15" stroke="#24221f" stroke-width="2"/>
    </pattern>
    <pattern id="grass" width="90" height="90" patternUnits="userSpaceOnUse">
      <rect width="90" height="90" fill="#1d2b22"/><circle cx="12" cy="20" r="3" fill="#2f4a33"/><circle cx="60" cy="50" r="4" fill="#2a4230"/><circle cx="34" cy="74" r="2.5" fill="#37563b"/>
    </pattern>
    <radialGradient id="warm" cx="50%" cy="55%" r="60%"><stop offset="0" stop-color="#ffb35c" stop-opacity=".28"/><stop offset="1" stop-color="#ffb35c" stop-opacity="0"/></radialGradient>
    <radialGradient id="fire" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffd27a" stop-opacity=".9"/><stop offset=".4" stop-color="#ff8a2a" stop-opacity=".5"/><stop offset="1" stop-color="#ff6a00" stop-opacity="0"/></radialGradient>
    <radialGradient id="gate" cx="50%" cy="55%" r="55%"><stop offset="0" stop-color="#e8fffb"/><stop offset=".35" stop-color="#5af0dc"/><stop offset="1" stop-color="#0c4d48"/></radialGradient>
    <radialGradient id="vig" cx="50%" cy="52%" r="62%"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".7"/></radialGradient>
    <radialGradient id="rug" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#6e2630"/><stop offset=".8" stop-color="#4a161d"/><stop offset="1" stop-color="#3a1016"/></radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a5232"/><stop offset="1" stop-color="#4e321c"/></linearGradient>
    <linearGradient id="banner" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a2b2b"/><stop offset="1" stop-color="#4f1414"/></linearGradient>
    <linearGradient id="bannerT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d6f68"/><stop offset="1" stop-color="#0c3d39"/></linearGradient>
    <linearGradient id="beer" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd35a"/><stop offset="1" stop-color="#b8731a"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity=".55"/></filter>
    <g id="tankard"><path d="M-6-9h12v15q0 3-3 3h-6q-3 0-3-3z" fill="url(#beer)" stroke="#5a3a10" stroke-width="1.2"/><path d="M6-6h3a3 3 0 0 1 0 6h-3" fill="none" stroke="#5a3a10" stroke-width="2"/><path d="M-6-9q6-3 12 0" fill="#fff8e6" stroke="#e8d9b0" stroke-width="1"/></g>
  </defs>

  <!-- ground outside the walls -->
  <rect width="900" height="600" fill="url(#grass)"/>
  <!-- walls -->
  <rect x="58" y="58" width="784" height="530" rx="14" fill="url(#stone)" stroke="#1a1816" stroke-width="3"/>
  <rect x="86" y="86" width="728" height="474" fill="url(#planks)"/>
  <rect x="86" y="86" width="728" height="474" fill="none" stroke="#1a120a" stroke-width="6"/>
  <rect x="86" y="86" width="728" height="474" fill="url(#warm)"/>

  <!-- rug (center gathering spot) -->
  <g filter="url(#shadow)"><circle cx="450" cy="335" r="150" fill="url(#rug)"/></g>
  <circle cx="450" cy="335" r="150" fill="none" stroke="#c99a3a" stroke-width="5"/>
  <circle cx="450" cy="335" r="118" fill="none" stroke="#3fd6c6" stroke-width="2.5" stroke-dasharray="3 9" opacity=".8"/>
  <path d="M450 285 488 335 450 385 412 335Z" fill="none" stroke="#3fd6c6" stroke-width="2.5" opacity=".75"/>

  <!-- portal -->
  <g filter="url(#shadow)">
    <path d="M384 196V110q0-62 66-62t66 62v86h-22v-84q0-40-44-40t-44 40v84z" fill="#4a4740" stroke="#24221f" stroke-width="3"/>
    <path d="M394 108q0-48 56-48t56 48" fill="none" stroke="#6e6a60" stroke-width="4"/>
  </g>
  <path d="M406 196v-84q0-40 44-40t44 40v84z" fill="url(#gate)"/>
  <ellipse cx="450" cy="140" rx="48" ry="62" fill="#5af0dc" opacity=".25" filter="url(#soft)"/>
  <ellipse cx="450" cy="200" rx="62" ry="12" fill="none" stroke="#3fd6c6" stroke-width="2" stroke-dasharray="4 6" opacity=".8"/>
  <!-- THE RAIDERS guild plaque: carved wood, iron brackets and a crest, fitted across the top wall above the portal -->
  <g filter="url(#shadow)">
    <rect x="318" y="60" width="264" height="34" rx="3" fill="url(#wood)" stroke="#2e1d10" stroke-width="3"/>
    <rect x="322" y="64" width="256" height="26" rx="2" fill="none" stroke="#c99a3a" stroke-width="1.5" opacity=".8"/>
    <path d="M318 60l-10 6v22l10 6M582 60l10 6v22l-10 6" fill="#55595e" stroke="#2a2c2f" stroke-width="2"/>
    <circle cx="332" cy="77" r="3" fill="#c99a3a"/><circle cx="568" cy="77" r="3" fill="#c99a3a"/>
    <path d="M424 56l26 0 0 10-13 6-13-6z" fill="#7a2230" stroke="#c99a3a" stroke-width="1.5"/>
    <text x="450" y="81" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="14" letter-spacing="3" fill="#ffd84a">THE RAIDERS</text>
  </g>
  <!-- BEER BANNERS: tankard crests on the walls -->
  <g transform="translate(0,-12)"><g filter="url(#shadow)">
    <path d="M250 60h34v58l-17-11-17 11z" fill="url(#banner)" stroke="#c99a3a" stroke-width="2"/>
    <path d="M616 60h34v58l-17-11-17 11z" fill="url(#banner)" stroke="#c99a3a" stroke-width="2"/>
    <path d="M180 320h30v50l-15-10-15 10z" fill="url(#bannerT)" stroke="#c99a3a" stroke-width="2"/>
    <path d="M690 420h30v50l-15-10-15 10z" fill="url(#banner)" stroke="#c99a3a" stroke-width="2"/>
  </g>
  <use href="#tankard" transform="translate(267,94) scale(1.2)"/>
  <use href="#tankard" transform="translate(633,94) scale(1.2)"/></g>
  <use href="#tankard" transform="translate(195,347) scale(.9)"/>
  <use href="#tankard" transform="translate(705,447) scale(.9)"/>

  <!-- quest board (left wall) and guild board (right wall) -->
  <g transform="translate(181,79)"><g filter="url(#shadow)">
    <rect x="86" y="122" width="66" height="78" rx="4" fill="url(#wood)" stroke="#2e1d10" stroke-width="3"/>
    <rect x="92" y="130" width="24" height="30" fill="#efe0b4" transform="rotate(-5 104 145)"/>
    <rect x="120" y="128" width="26" height="24" fill="#f4e8c8"/>
    <rect x="96" y="164" width="22" height="28" fill="#e6d29c" transform="rotate(4 107 178)"/>
    <rect x="122" y="158" width="24" height="32" fill="#efe0b4"/>
  </g>
  </g><g transform="translate(-181,79)"><g filter="url(#shadow)">
    <rect x="748" y="122" width="66" height="78" rx="4" fill="#3a2a4a" stroke="#c99a3a" stroke-width="3"/>
    <path d="M781 132l18 6v14c0 14-9 20-18 24-9-4-18-10-18-24v-14z" fill="#1d7f78" stroke="#ffd84a" stroke-width="2.5"/>
    <path d="M781 142l7 10-7 10-7-10z" fill="#ffd84a"/>
  </g>

</g>  <!-- fireplace (left wall) + couch beside it -->
  <ellipse cx="96" cy="370" rx="70" ry="80" fill="url(#fire)"/>
  <g filter="url(#shadow)"><rect x="58" y="325" width="40" height="90" fill="#2a2724" stroke="#1a1816" stroke-width="3"/><rect x="66" y="337" width="26" height="66" fill="#140c08"/></g>
  <path d="M74 395q4-22 10-14q2-16 8-6q4 10 0 20z" fill="#ffb347"/><path d="M78 395q3-12 7-8q3 6 0 8z" fill="#fff1a8"/>
  <g filter="url(#shadow)">
    <rect x="62" y="432" width="88" height="26" rx="8" fill="#6b2a33" stroke="#2e1218" stroke-width="2"/>
    <rect x="66" y="422" width="80" height="14" rx="6" fill="#7e3440" stroke="#2e1218" stroke-width="2"/>
    <rect x="58" y="432" width="10" height="26" rx="4" fill="#5a2028"/><rect x="140" y="432" width="10" height="26" rx="4" fill="#5a2028"/>
  </g>

  <!-- ONE bar (right wall) with beer -->
  <g filter="url(#shadow)"><rect x="770" y="300" width="34" height="200" rx="4" fill="url(#wood)" stroke="#2e1d10" stroke-width="2"/></g>
  <use href="#tankard" transform="translate(787,330) scale(.9)"/>
  <use href="#tankard" transform="translate(787,380) scale(.9)"/>
  <use href="#tankard" transform="translate(787,440) scale(.9)"/>

  <!-- merchant stall (bottom middle) -->
  <g filter="url(#shadow)">
    <rect x="404" y="552" width="92" height="36" rx="4" fill="#2a1a10" stroke="#c99a3a" stroke-width="2"/>
    <path d="M410 552q40-14 80 0" fill="none" stroke="#c99a3a" stroke-width="3"/>
    <rect x="380" y="528" width="140" height="16" rx="3" fill="url(#wood)" stroke="#2e1d10" stroke-width="2"/>
  </g>

  <g transform="translate(440,44)">
  <!-- TOP-LEFT BAR: counter with bottles and stools -->
  <g filter="url(#shadow)">
    <rect x="170" y="96" width="130" height="22" rx="4" fill="url(#wood)" stroke="#2e1d10" stroke-width="2"/>
    <rect x="178" y="84" width="7" height="14" rx="2" fill="#7a2230"/><rect x="200" y="84" width="7" height="14" rx="2" fill="#1d7f78"/>
    <rect x="256" y="84" width="7" height="14" rx="2" fill="#c9a24a"/><rect x="278" y="84" width="7" height="14" rx="2" fill="#4a3a7a"/>
  </g>
  <g fill="#3d2716" stroke="#1a120a" stroke-width="1.5"><circle cx="188" cy="168" r="7"/><circle cx="228" cy="168" r="7"/><circle cx="268" cy="168" r="7"/></g>
  </g>
  <!-- TOP-RIGHT BOTTLE WALL: shelf of colored bottles on the inside wall -->
  <g filter="url(#shadow)"><rect x="598" y="116" width="200" height="8" rx="2" fill="url(#wood)" stroke="#2e1d10" stroke-width="1.5"/></g>
  <g>
    <rect x="608" y="92" width="4" height="9" fill="#2a2420"/><rect x="606" y="100" width="9" height="16" rx="2" fill="#7a2230" stroke="#1a120a" stroke-width="1"/><rect x="608" y="104" width="2" height="6" fill="#fff8"/>
    <rect x="623" y="92" width="4" height="9" fill="#2a2420"/><rect x="621" y="100" width="9" height="16" rx="2" fill="#1d7f78" stroke="#1a120a" stroke-width="1"/><rect x="623" y="104" width="2" height="6" fill="#fff8"/>
    <rect x="638" y="92" width="4" height="9" fill="#2a2420"/><rect x="636" y="100" width="9" height="16" rx="2" fill="#c9a24a" stroke="#1a120a" stroke-width="1"/><rect x="638" y="104" width="2" height="6" fill="#fff8"/>
    <rect x="653" y="92" width="4" height="9" fill="#2a2420"/><rect x="651" y="100" width="9" height="16" rx="2" fill="#4a3a7a" stroke="#1a120a" stroke-width="1"/><rect x="653" y="104" width="2" height="6" fill="#fff8"/>
    <rect x="668" y="92" width="4" height="9" fill="#2a2420"/><rect x="666" y="100" width="9" height="16" rx="2" fill="#2e5c3a" stroke="#1a120a" stroke-width="1"/><rect x="668" y="104" width="2" height="6" fill="#fff8"/>
    <rect x="683" y="92" width="4" height="9" fill="#2a2420"/><rect x="681" y="100" width="9" height="16" rx="2" fill="#b8731a" stroke="#1a120a" stroke-width="1"/><rect x="683" y="104" width="2" height="6" fill="#fff8"/>
    <rect x="698" y="92" width="4" height="9" fill="#2a2420"/><rect x="696" y="100" width="9" height="16" rx="2" fill="#5a7a2a" stroke="#1a120a" stroke-width="1"/><rect x="698" y="104" width="2" height="6" fill="#fff8"/>
    <rect x="713" y="92" width="4" height="9" fill="#2a2420"/><rect x="711" y="100" width="9" height="16" rx="2" fill="#8a3b7a" stroke="#1a120a" stroke-width="1"/><rect x="713" y="104" width="2" height="6" fill="#fff8"/>
    <rect x="728" y="92" width="4" height="9" fill="#2a2420"/><rect x="726" y="100" width="9" height="16" rx="2" fill="#7a2230" stroke="#1a120a" stroke-width="1"/><rect x="728" y="104" width="2" height="6" fill="#fff8"/>
    <rect x="743" y="92" width="4" height="9" fill="#2a2420"/><rect x="741" y="100" width="9" height="16" rx="2" fill="#c9a24a" stroke="#1a120a" stroke-width="1"/><rect x="743" y="104" width="2" height="6" fill="#fff8"/>
    <rect x="758" y="92" width="4" height="9" fill="#2a2420"/><rect x="756" y="100" width="9" height="16" rx="2" fill="#1d7f78" stroke="#1a120a" stroke-width="1"/><rect x="758" y="104" width="2" height="6" fill="#fff8"/>
    <rect x="773" y="92" width="4" height="9" fill="#2a2420"/><rect x="771" y="100" width="9" height="16" rx="2" fill="#b8731a" stroke="#1a120a" stroke-width="1"/><rect x="773" y="104" width="2" height="6" fill="#fff8"/>
    
  </g>
  <!-- timber frame, back layer (2x4 beams along the walls) -->
  <g fill="url(#wood)" stroke="#2e1d10" stroke-width="2" filter="url(#shadow)">
    <rect x="86" y="96" width="728" height="10"/>
    <rect x="86" y="540" width="728" height="10"/>
    <rect x="86" y="96" width="10" height="454"/>
    <rect x="804" y="96" width="10" height="454"/>
  </g>
  <!-- foreground beams on the outer edges (darker, drawn over the walls for depth) -->
  <g fill="#24160c" stroke="#120a05" stroke-width="2" opacity=".92">
    <rect x="40" y="40" width="820" height="20"/>
    <rect x="40" y="540" width="820" height="20"/>
    <rect x="40" y="40" width="20" height="520"/>
    <rect x="840" y="40" width="20" height="520"/>
  </g>
  <!-- warm light pools -->
  <g filter="url(#soft)" opacity=".5"><circle cx="160" cy="370" r="60" fill="#ffb35c" opacity=".25"/><circle cx="740" cy="400" r="50" fill="#ffb35c" opacity=".2"/></g>
  <rect width="900" height="600" fill="url(#vig)"/>
</svg>