<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Runebound</title><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&display=swap"><link rel="icon" type="image/svg+xml" href="assets/icon.svg"><link rel="apple-touch-icon" href="assets/icon.png">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <style>
      :root {
        --bg: #0b0f14;
        --fg: #e6f1ef;
        --pn: #151d26;
        --ln: #2c3b48;
        --ac: #1d7f78;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      :root[data-theme="light"] {
        --bg: #eef1f6;
        --fg: #1a1f2b;
        --pn: #fff;
        --ln: #c4ccdc;
        --ac: #1f8f86;
      }
      :root[data-theme="dark"] {
        --bg: #0b0f14;
        --fg: #e6f1ef;
        --pn: #151d26;
        --ln: #2c3b48;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font:
          14px Georgia,
          serif;
        touch-action: none;
        user-select: none;
        overflow: hidden;
      }
      canvas {
        position: fixed;
        left: 0;
        top: 0;
        width: calc(100% - var(--dw, 0px));
        height: calc(100% - var(--dh, 0px));
      }
      #ui,
      #dlg {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(ellipse at center, #0b1119d9, #000e);
        animation: fade 0.35s ease both;
      }
      [hidden] {
        display: none !important;
      }
      .coin {
        display: inline-block;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        vertical-align: -2px;
        margin-right: 4px;
        background: radial-gradient(circle at 35% 30%, #fff3a8, #f5c518 45%, #b07d00);
        border: 1.5px solid #8a5f00;
        box-shadow: inset 0 0 0 2px #ffe27a55;
      }
      .pn {
        background: var(--pn);
        border: 1px solid var(--ln);
        box-shadow:
          0 10px 40px #000a,
          0 0 0 1px #3fd6c610;
        animation: pop 0.3s ease both;
        border-radius: 12px;
        padding: 14px;
        width: min(440px, 92vw);
        max-height: 90vh;
        overflow: auto;
        touch-action: pan-y;
        user-select: text;
      }
      h2 {
        margin: 0 0 8px;
        font-size: 22px;
        letter-spacing: 0.5px;
        text-shadow: 0 0 14px #3fd6c655;
      }
      button {
        font: inherit;
        padding: 9px 12px;
        margin: 3px;
        border-radius: 8px;
        border: 1px solid var(--ln);
        background: var(--ac);
        color: #fff;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      button {
        transition:
          transform 0.12s ease,
          filter 0.2s ease,
          opacity 0.2s;
      }
      button:not(:disabled):hover {
        filter: brightness(1.12);
      }
      button:not(:disabled):active {
        transform: scale(0.96);
      }
      @keyframes fade {
        from {
          opacity: 0;
        }
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: translateY(8px) scale(0.97);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
      button.alt {
        background: transparent;
        color: var(--fg);
      }
      button img {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        vertical-align: middle;
        margin-right: 5px;
      }
      [hidden] {
        display: none !important;
      }
      .sm {
        font-size: 12px;
        opacity: 0.75;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 6px 0;
        border-top: 1px solid var(--ln);
      }
      .gold {
        color: #d9a400;
        font-weight: bold;
      }
      .qh {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 6px 0 8px;
      }
      .qn {
        font-size: 17px;
        font-weight: bold;
        color: #ffd84a;
        text-shadow: 0 0 10px #ffb30055;
      }
      .qm {
        flex: none;
        display: inline-grid;
        place-items: center;
        width: 18px;
        height: 18px;
        margin: 4px;
        transform: rotate(45deg);
        border: 2px solid #ffd84a;
        background: #120d05;
        box-shadow: 0 0 10px #ffb30099;
      }
      .qm b {
        transform: rotate(-45deg);
        color: #ffd84a;
        font-size: 13px;
      }
      .qm.active {
        border-color: #9aa6b2;
        box-shadow: none;
      }
      .qm.active b {
        color: #9aa6b2;
      }
      .qtag {
        font-size: 11px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: #ffd84a;
        opacity: 0.85;
      }
      .qm.active + div .qtag {
        color: #9aa6b2;
      }
      .qo {
        border-left: 3px solid #ffd84a;
        background: #0005;
        border-radius: 4px;
        padding: 6px 10px;
        margin: 8px 0;
      }
      .qo.done {
        border-color: #7dff9a;
        color: #7dff9a;
      }
      .up {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px;
        margin: 6px 0;
        border: 1px solid var(--ln);
        border-left: 3px solid var(--uc);
        border-radius: 10px;
        background: linear-gradient(90deg, color-mix(in srgb, var(--uc) 16%, transparent), transparent 65%);
      }
      .up img {
        width: 44px;
        height: 44px;
        flex: none;
        filter: drop-shadow(0 0 6px var(--uc));
      }
      .up .nm {
        font-weight: bold;
        color: var(--uc);
      }
      .pips {
        display: inline-flex;
        gap: 4px;
        margin-left: 6px;
        vertical-align: middle;
      }
      .pips i {
        width: 7px;
        height: 7px;
        transform: rotate(45deg);
        border: 1px solid var(--uc);
        display: inline-block;
      }
      .pips i.on {
        background: var(--uc);
        box-shadow: 0 0 6px var(--uc);
      }
      .up button {
        margin-left: auto;
        flex: none;
        background: var(--uc);
        color: #111;
        font-weight: bold;
        min-width: 66px;
        border-color: #0004;
      }
      .purse {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 18px;
        padding: 4px 12px;
        border: 1px solid #ffd84a88;
        border-radius: 20px;
        background: #0006;
      }
      .tt {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 4px;
        border-top: 1px solid var(--ln);
      }
      .tt b {
        color: var(--tc);
      }
      .tt button {
        margin-left: auto;
      }
      .tt.lk {
        opacity: 0.5;
      }
      input.nm {
        font: inherit;
        font-size: 16px;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid var(--ln);
        background: #0006;
        color: var(--fg);
        width: 100%;
        box-sizing: border-box;
        margin: 6px 0 10px;
      }
      #btns #bt {
        /* under the gold counter (game y ≈ 80 of 600) */
        left: 1.4%;
        top: 13.5%;
        width: auto;
        height: 36px;
        border-radius: 10px;
        padding: 0 12px;
        font-size: 13px;
        background-color: #1b2a33;
        border-color: #d9a40099;
      }
      .dv {
        --dw: min(400px, 38vw);
        --dh: 0px;
      }
      @media (max-width: 760px), (max-aspect-ratio: 1/1) {
        .dv {
          --dw: 0px;
          --dh: 48vh;
        }
      }
      .dv #jz {
        bottom: var(--dh);
      }
      #dev {
        position: fixed;
        z-index: 30;
        right: 0;
        top: 0;
        bottom: 0;
        width: var(--dw);
        box-sizing: border-box;
        background: var(--pn);
        border-left: 2px solid #d9a400;
        padding: 12px;
        padding-top: calc(12px + env(safe-area-inset-top, 0px));
        font-size: var(--df, 15px);
        overflow: auto;
        touch-action: pan-y;
        user-select: text;
      }
      @media (max-width: 760px), (max-aspect-ratio: 1/1) {
        #dev {
          left: 0;
          top: auto;
          width: auto;
          height: var(--dh);
          border-left: 0;
          border-top: 2px solid #d9a400;
        }
      }
      #dev.min {
        left: 6px;
        right: auto;
        top: 50%;
        bottom: auto;
        width: auto;
        height: auto;
        padding: 4px;
        border: 2px solid #d9a400;
        border-radius: 10px;
        overflow: visible;
      }
      #dev button {
        padding: 0.55em 0.8em;
        margin: 3px;
        font-size: 1em;
      }
      #dev input[type="number"] {
        width: 5em;
        font-size: 1em;
        padding: 0.35em;
      }
      #dev select {
        font-size: 1em;
        padding: 0.35em;
        max-width: 100%;
      }
      #dev .row {
        flex-wrap: wrap;
        gap: 6px;
        padding: 8px 0;
      }
      #dev h3 {
        margin: 12px 0 0;
        font-size: 1.05em;
        color: #d9a400;
      }
      #dev label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-right: 12px;
      }
      #dev input[type="checkbox"] {
        width: 1.3em;
        height: 1.3em;
      }
      #dev .hd {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 4px;
        flex-wrap: wrap;
      }
      #btns,
      #jz {
        display: none;
      }
      .g #btns,
      .g #jz {
        display: block;
      }
      /* #btns is a box over the game frame (sized in rs()); clicks pass through it except on buttons */
      #btns {
        position: fixed;
        pointer-events: none;
        z-index: 10;
      }
      #btns button {
        pointer-events: auto;
        position: absolute;
        width: 70px;
        height: 70px;
        border-radius: 50%;
        border: 2px solid #fff8;
        font-size: 11px;
        padding: 0;
        background-color: #24404a;
        text-shadow: 0 1px 2px #000;
      }
      /* dev build board in the left black margin */
      #board {
        position: fixed; left: 10px; top: 10px; bottom: 10px; z-index: 5; overflow: auto; font-size: 12px; color: #cfe;
        background: #0b1218e6; border: 1px solid #2c3b48; border-radius: 10px; padding: 10px; box-sizing: border-box; user-select: text;
      }
      #board.top { left: 10px; right: 10px; top: 6px; bottom: auto; padding: 6px 10px; }
      #board.top .tb { display: none; }
      #board.top ul { columns: 2; column-gap: 24px; }
      #board ul { list-style: none; margin: 6px 0 12px; padding: 0; }
      #board li { padding: 3px 0; border-bottom: 1px solid #1c2832; break-inside: avoid; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      /* crypto-news build feed */
      #board .live { font: bold 12px "Cinzel", Georgia; color: #ff6070; letter-spacing: 2px; display: flex; align-items: center; gap: 6px; }
      #board .dot { width: 8px; height: 8px; border-radius: 50%; background: #ff3b4e; box-shadow: 0 0 8px #ff3b4e; animation: livePulse 1.2s ease-in-out infinite; }
      @keyframes livePulse { 50% { opacity: 0.3; transform: scale(0.7); } }
      #board .ticker { overflow: hidden; white-space: nowrap; margin: 8px -10px; padding: 5px 0; background: #05080c; border-block: 1px solid #1c2832; }
      #board .tkr { display: inline-block; animation: tickerMove 28s linear infinite; }
      #board .tk { margin-right: 26px; font-size: 11px; }
      #board .tk i { color: #8fa3ad; font-style: normal; font-size: 9px; margin-left: 6px; }
      @keyframes tickerMove { to { transform: translateX(-50%); } }
      #board .chips { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin: 6px 0; }
      #board .ver { margin-left: auto; color: #ffd84a; font-size: 12px; letter-spacing: 1px; }
      #board .vnote { font-size: 11px; color: #cfe; margin-top: 3px; }
      #board .cdl { display: flex; align-items: center; gap: 2px; margin-top: 3px; height: 6px; }
      #board .cdl i { display: block; height: 6px; border-radius: 1px; min-width: 2px; }
      #board .cdl .ca { background: #7dff9a; } #board .cdl .cd { background: #ff6070; }
      #board .cdl em { font-style: normal; font-size: 9px; color: #8fa3ad; margin-left: 4px; white-space: nowrap; }
      #board li { white-space: normal !important; }
      #board .chip { background: #0f1a22; border: 1px solid #1c2832; border-radius: 6px; padding: 5px 6px; }
      #board .chip span { display: block; font-size: 8px; color: #8fa3ad; letter-spacing: 1px; }
      #board .chip b { font: bold 18px Georgia; color: #e6f1ef; font-variant-numeric: tabular-nums; }
      #board .chip em { font-style: normal; font-size: 10px; margin-left: 4px; color: #8fa3ad; }
      #board .chip em.up { color: #7dff9a; } #board .chip em.down { color: #ff6070; }
      #board .spark { margin: 6px 0 4px; }
      #board .spark span { font-size: 8px; color: #8fa3ad; letter-spacing: 1px; }
      #board .spark svg { display: block; width: 100%; height: 34px; }
      #board.top .chips, #board.top .spark, #board.top .ticker { display: none; }
      #board .tag { display: inline-block; min-width: 40px; font: bold 9px/16px Georgia, serif; text-align: center; border-radius: 4px; margin-right: 6px; letter-spacing: 0.5px; }
      #board .tag.in { background: #1f5c34; color: #7dff9a; }
      #board .tag.out { background: #5c1f26; color: #ff8a94; }
      #board .tag.fix { background: #5c4a1f; color: #ffd84a; }
      #board b { color: #ffd84a; letter-spacing: 1.5px; }
      #board table { width: 100%; border-collapse: collapse; margin-top: 8px; }
      #board th { text-align: left; font-size: 10px; color: #8fa3ad; letter-spacing: 1px; padding: 4px; border-bottom: 1px solid #2c3b48; }
      #board td { padding: 5px 4px; border-bottom: 1px solid #1c2832; vertical-align: top; }
      #board td:first-child { color: #ffd84a; font-weight: bold; white-space: nowrap; }
      #board .p1 { color: #ff6070; font-weight: bold; } #board .p2 { color: #ffb84a; } #board .p3 { color: #8fa3ad; }
      #board tr.wip td:last-child { color: #ffb84a; } #board tr.done { opacity: 0.45; } #board tr.done td:last-child { color: #7dff9a; }
      #board td:last-child { white-space: nowrap; font-size: 10px; }
      /* key / controller hint badges (hidden on touch) */
      .kh {
        position: absolute; top: -6px; right: -6px; min-width: 22px; height: 22px; padding: 0 4px; box-sizing: border-box;
        display: grid; place-items: center; border-radius: 6px; font: bold 13px/1 Georgia, serif; color: #fff;
        background: #0b1218; border: 2px solid #ffffffaa; box-shadow: 0 2px 0 #000a; pointer-events: none;
      }
      .kh:empty { display: none; }
      #btns #bi .kh { position: relative; top: auto; right: auto; display: inline-grid; margin-left: 8px; vertical-align: 2px; color: #fff; text-shadow: none; }
      /* controller: round face-button colors (Xbox layout) */
      body[data-in="pad"] .kh { border-radius: 50%; border-color: #fff; }
      body[data-in="pad"] .kh.k0 { background: #2fa84f; }
      body[data-in="pad"] .kh.k1 { background: #2f6fd8; }
      body[data-in="pad"] .kh.k2 { background: #e0b100; }
      body[data-in="pad"] .kh.k3 { background: #d63b3b; }
      /* skill buttons: rune-stone discs. --sc = class color, --p = cooldown left (0-100%) */
      #btns .sk {
        width: 74px; height: 74px; padding: 0; border-radius: 50%;
        border: 3px solid var(--sc, #3fd6c6);
        background: radial-gradient(circle at 50% 35%, #2a3a48, #0b1218 70%);
        box-shadow: 0 0 0 2px #0008, 0 4px 0 #0008, 0 0 14px color-mix(in srgb, var(--sc) 50%, transparent);
        color: var(--sc); overflow: visible; transition: transform 0.08s, box-shadow 0.2s;
      }
      /* thick, high-contrast icons: CSS stroke-width overrides the per-path values; dark outline + glow */
      #btns .sk svg {
        width: 46px; height: 46px; display: block; margin: auto; overflow: visible;
        filter: drop-shadow(0 0 1.5px #000) drop-shadow(0 0 1.5px #000) drop-shadow(0 0 7px var(--sc));
      }
      #btns .sk svg * { stroke-width: 4.5px; }
      #btns .sk svg circle[opacity] { stroke-width: 3px; }
      #btns .sk .sn {
        position: absolute; left: 50%; bottom: -20px; transform: translateX(-50%); white-space: nowrap;
        font-size: 11px; font-weight: bold; color: #fff; text-shadow: 0 1px 3px #000, 0 0 2px #000; letter-spacing: 0.5px;
      }
      /* cooldown: dark sweep + big number */
      #btns .sk .cdv {
        position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
        background: conic-gradient(#000b var(--p, 0%), transparent 0);
      }
      #btns .sk .cdn {
        position: absolute; inset: 0; display: grid; place-items: center;
        font-size: 22px; font-weight: bold; color: #fff; text-shadow: 0 0 6px #000, 0 2px 2px #000;
      }
      #btns .sk.cd svg { opacity: 0.35; filter: grayscale(1); }
      #btns .sk.rd { animation: skReady 0.4s ease-out; }
      #btns .sk:active { transform: scale(0.9); }
      @keyframes skReady { 0% { box-shadow: 0 0 0 2px #0008, 0 0 40px var(--sc); transform: scale(1.12); } }
      #btns #b0 { right: 22px; bottom: 34px; width: 92px; height: 92px; }
      #btns #b0 svg { width: 58px; height: 58px; }
      #btns #b1 { right: 132px; bottom: 30px; }
      #btns #b2 { right: 102px; bottom: 134px; }
      /* logo font (Cinzel, same as the icon / logo / banner) for headings and big buttons; Georgia if offline */
      h2, .claim, .qn, #btns #bi, .kh { font-family: "Cinzel", Georgia, serif; }
      h2 { color: #ffd84a; letter-spacing: 1.5px; }
      /* secondary buttons (Close / Farewell) in every menu: dark rune plate, soft gold outline, pointed ends */
      button.alt {
        display: block; width: 100%; margin: 12px 0 0; padding: 11px 16px;
        font: bold 14px "Cinzel", Georgia, serif; letter-spacing: 3px; text-transform: uppercase;
        color: #e8d8a8; border: none; border-radius: 0; position: relative; isolation: isolate;
        background: linear-gradient(180deg, #ffd84a88, #a86f0088);
        clip-path: polygon(12px 0, calc(100% - 12px) 0, 100% 50%, calc(100% - 12px) 100%, 12px 100%, 0 50%);
        transition: color 0.2s, filter 0.2s, transform 0.1s;
      }
      button.alt::before {
        content: ""; position: absolute; inset: 1.5px; z-index: -1;
        background: linear-gradient(180deg, #1a2430, #0b1218);
        clip-path: polygon(11px 0, calc(100% - 11px) 0, 100% 50%, calc(100% - 11px) 100%, 11px 100%, 0 50%);
      }
      button.alt:hover { color: #ffd84a; filter: drop-shadow(0 0 6px #ffb30066) brightness(1.15); }
      button.alt:active { transform: scale(0.98); }
      /* big gold claim button */
      button.claim {
        display: block; width: 100%; margin: 12px 0 2px; padding: 16px; font-size: 22px; font-weight: bold; letter-spacing: 2px;
        color: #2a1a00; border: 2px solid #fff3c4; border-radius: 14px;
        background: linear-gradient(180deg, #ffe680, #ffc21a 55%, #e09a00);
        animation: biGlow 1.4s ease-in-out infinite; position: relative; overflow: hidden;
      }
      button.claim::after {
        content: ""; position: absolute; inset: 0 auto 0 -60%; width: 40%;
        background: linear-gradient(100deg, transparent, #fff9, transparent); transform: skewX(-20deg);
        animation: biShine 2.2s ease-in-out infinite;
      }
      button.claim .coin { width: 20px; height: 20px; vertical-align: -3px; }
      /* daily bonus track */
      .daily { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin: 10px 0; }
      .dd { text-align: center; padding: 6px 2px; border: 1px solid var(--ln); border-radius: 8px; background: #0005; font-size: 12px; }
      .dd b { display: block; color: #ffd84a; }
      .dd.got { opacity: 0.45; }
      .dd.now { border-color: #ffd84a; box-shadow: 0 0 14px #ffb30099; animation: canPulse 1.2s ease-in-out infinite; }
      /* shop: affordable cards pulse, bought card flashes, mastery bar */
      .up { transition: transform 0.15s; }
      .up.can { box-shadow: 0 0 0 1px var(--uc), 0 0 14px color-mix(in srgb, var(--uc) 40%, transparent); }
      .up.can button { animation: canPulse 1.2s ease-in-out infinite; }
      .up:not(.can) button:disabled { background: #2c3b48; color: #8fa3ad; }
      .up.bought { animation: bought 0.5s ease-out; }
      .up.bought .pips i.on:last-of-type, .up.bought .pips i.on:nth-last-child(1 of .on) { animation: pipPop 0.5s ease-out; }
      .need { color: #ff9f8a; opacity: 0.9; }
      .mast { margin: 10px 0 4px; }
      .mbar { height: 6px; border-radius: 3px; background: #0006; overflow: hidden; margin-top: 3px; }
      .mbar i { display: block; height: 100%; background: linear-gradient(90deg, #3fd6c6, #ffd84a); transition: width 0.4s; }
      @keyframes canPulse { 50% { filter: brightness(1.25); transform: scale(1.05); } }
      @keyframes bought { 0% { transform: scale(1); background-color: #fff3; } 30% { transform: scale(1.04); } 100% { transform: scale(1); } }
      @keyframes pipPop { 0% { transform: rotate(45deg) scale(2.2); } 100% { transform: rotate(45deg) scale(1); } }
      /* interact button (Talk / Shop / Enter arena): sits right above the skill buttons, under the thumb */
      #btns #bi {
        right: 22px;
        bottom: 246px;
        width: auto;
        min-width: 150px;
        height: 62px;
        padding: 0 22px;
        /* quest-marker style: dark rune plate, gold outline + lettering, pointed (diamond) ends */
        border-radius: 0;
        border: none;
        clip-path: polygon(16px 0, calc(100% - 16px) 0, 100% 50%, calc(100% - 16px) 100%, 16px 100%, 0 50%);
        font-size: 17px;
        font-weight: bold;
        letter-spacing: 2px;
        color: #ffd84a;
        text-shadow: 0 0 8px #ffb30099;
        /* gold plate here; the dark inner plate is ::before (see below), so the outline follows the pointed ends */
        background: linear-gradient(180deg, #fff1a8, #ffcf3a 50%, #a86f00);
        padding: 0 30px;
        isolation: isolate;
        animation: biPop 0.25s cubic-bezier(0.2, 1.6, 0.4, 1) both, biGlow 1.4s ease-in-out 0.25s infinite;
        overflow: hidden;
      }
      /* smaller interact button for the portal */
      /* Enter Arena: smaller, bottom-middle of the game frame (under the Merchant) */
      #btns #bi.small { height: 46px; min-width: 0; width: 170px; font-size: 13px; padding: 0 22px; left: calc(50% - 85px); right: auto; bottom: 10px; }
      /* dark inner plate of the interact button (inset 2.5px = gold outline width) */
      #btns #bi::before {
        content: ""; position: absolute; inset: 2.5px; z-index: -1;
        background: radial-gradient(ellipse at 50% 30%, #2a1f0a, #120d05 70%);
        clip-path: polygon(15px 0, calc(100% - 15px) 0, 100% 50%, calc(100% - 15px) 100%, 15px 100%, 0 50%);
      }
      /* moving shine stripe */
      #btns #bi::after {
        content: "";
        position: absolute;
        inset: 0 auto 0 -60%;
        width: 40%;
        background: linear-gradient(100deg, transparent, #fff9, transparent);
        transform: skewX(-20deg);
        animation: biShine 2.2s ease-in-out infinite;
      }
      @keyframes biPop {
        from { transform: scale(0.4); opacity: 0; }
      }
      @keyframes biGlow {
        0%, 100% { box-shadow: 0 0 10px #ffb30088, 0 4px 0 #a86f00; }
        50% { box-shadow: 0 0 26px #ffd84aee, 0 4px 0 #a86f00; }
      }
      @keyframes biShine {
        0%, 60% { left: -60%; }
        100% { left: 130%; }
      }
      #jz {
        position: fixed;
        left: 0;
        bottom: 0;
        width: 50%;
        height: 65%;
      }
      #jb {
        position: fixed;
        width: 100px;
        height: 100px;
        border-radius: 50%;
        border: 2px solid #fff6;
        background: #fff2;
        display: none;
        margin: -50px 0 0 -50px;
      }
      #jk {
        position: absolute;
        left: 30px;
        top: 30px;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: #fffa;
      }
    </style>

      const PR = 11;
      const PEMB = {
        tank: new (typeof Path2D == "function" ? Path2D : Object)("M0-10l8 3v5c0 7-4 9-8 11-4-2-8-4-8-11v-5z"),
        dps: new (typeof Path2D == "function" ? Path2D : Object)("M-1.6-11h3.2v13h-3.2zM-6 2h12v2.6h-12zM-1.3 4.6h2.6v6h-2.6z"),
        heal: new (typeof Path2D == "function" ? Path2D : Object)("M-2.6-9h5.2v6.4h6.4v5.2h-6.4v6.4h-5.2v-6.4h-6.4v-5.2h6.4z"),
      };
      const FACE_A = { r: 0, d: Math.PI / 2, l: Math.PI, u: -Math.PI / 2 };
      function drawPlayer(p, dt) {
        const col = SKC[p.cls],
          moving = Math.hypot(p.dx, p.dy) > 0.1,
          da = p.ds > 0, /* dashing */
          step = Math.sin(S.tm * 16), /* walk cycle */
          bob = moving && !da ? -Math.abs(step) * 4 : 0;
        /* footstep dust while walking */
        p.stp = (p.stp || 0) - dt;
        if (moving && !da && p.stp <= 0) { p.stp = 0.17; burst(p.x + rnd(-4, 4), p.y + PR, "#6c7a86", 2, 25); }
        p.lvp = Math.max(0, (p.lvp || 0) - dt); /* level-up pop timer */
        c.save();
        c.translate(p.x, p.y);
        c.globalAlpha = p.hp <= 0 ? 0.35 : p.inv > 0 ? 0.55 + 0.45 * Math.sin(S.tm * 60) : 1;
        /* ground shadow */
        c.fillStyle = "#0008";
        c.beginPath();
        c.ellipse(0, PR + 2, PR * 0.9, 4, 0, 0, 6.3);
        c.fill();
        c.save();
        c.translate(0, bob);
        if (da) {
          /* dash: glowing streak behind + stretch along the dash direction */
          const ang = Math.atan2(p.dvy, p.dvx), len = PR * 3.2;
          const gr = c.createLinearGradient(-Math.cos(ang) * len, -Math.sin(ang) * len, 0, 0);
          gr.addColorStop(0, "transparent");
          gr.addColorStop(1, col);
          c.strokeStyle = gr;
          c.lineWidth = PR * 1.5;
          c.lineCap = "round";
          c.beginPath();
          c.moveTo(-Math.cos(ang) * len, -Math.sin(ang) * len);
          c.lineTo(0, 0);
          c.stroke();
          c.rotate(ang);
          c.scale(1.45, 0.72);
          c.rotate(-ang);
        } else if (moving) {
          /* walk: lean into the move + squash and stretch on each step */
          c.rotate(cl(p.dx, -1, 1) * 0.14);
          c.scale(1 + 0.07 * Math.abs(step), 1 - 0.07 * Math.abs(step));
        }
        /* body disc */
        const bg = c.createRadialGradient(0, -4, 1, 0, 0, PR + 1);
        bg.addColorStop(0, "#1c2a36");
        bg.addColorStop(1, "#0b1218");
        c.fillStyle = bg;
        c.strokeStyle = col;
        c.lineWidth = 2.5;
        c.shadowColor = col;
        c.shadowBlur = 8;
        c.beginPath();
        c.arc(0, 0, PR, 0, 6.3);
        c.fill();
        c.stroke();
        c.shadowBlur = 0;
        /* facing arrow: snaps to the move direction */
        c.save();
        /* keyboard + mouse: point at the cursor; touch / controller: snap to the move direction */
        c.rotate(p === P && INMODE == "kb" && MOUSE.on ? Math.atan2(MOUSE.y - p.y, MOUSE.x - p.x) : FACE_A[p.f || "d"]);
        c.fillStyle = col;
        c.beginPath();
        c.moveTo(PR + 6, 0);
        c.lineTo(PR + 1, -4);
        c.lineTo(PR + 1, 4);
        c.closePath();
        c.fill();
        c.restore();
        /* class emblem */
        c.fillStyle = col;
        c.save();
        c.scale(0.82, 0.82);
        c.fill(PEMB[p.cls]);
        c.restore();
        /* tank armor from dash: blue shield ring */
        if (p.ar > 0) {
          c.strokeStyle = `rgba(77,163,255,${0.4 + 0.3 * Math.sin(S.tm * 10)})`;
          c.lineWidth = 3;
          c.beginPath();
          c.arc(0, 0, PR + 5, 0, 6.3);
          c.stroke();
        }
        c.restore();
        /* health bar turns white while armored (tank dash); thin strip above = armor time left */
        bar(-14, -PR - 12, 28, 4, p.hp / p.mh, p.ar > 0 ? "#eef6ff" : "#48e07a");
        if (p.ar > 0) {
          c.fillStyle = "#ffffff";
          c.shadowColor = "#cfe6ff";
          c.shadowBlur = 6;
          c.fillRect(-14, -PR - 15, 28 * cl(p.ar / DASH.tank.ar, 0, 1), 2);
          c.shadowBlur = 0;
        }
        if (p === P) {
          /* level badge on the left: grows with level, tier color, pops on level-up */
          const L = lvlInfo().L,
            lc = lvlCol(L),
            br = 7 + Math.min(6, L * 0.12),
            pop = 1 + p.lvp * 1.2;
          c.save();
          c.translate(-PR - br - 4, 0);
          c.scale(pop, pop);
          c.shadowColor = lc;
          c.shadowBlur = L >= 10 ? 10 + 4 * Math.sin(S.tm * 4) : 4;
          c.fillStyle = "#0b1218";
          c.strokeStyle = lc;
          c.lineWidth = 2;
          c.beginPath(); /* diamond rune badge */
          c.moveTo(0, -br - 2);
          c.lineTo(br + 2, 0);
          c.lineTo(0, br + 2);
          c.lineTo(-br - 2, 0);
          c.closePath();
          c.fill();
          c.stroke();
          c.shadowBlur = 0;
          c.fillStyle = lc;
          c.font = `bold ${Math.round(br * 1.15)}px Georgia`;
          c.textAlign = "center";
          c.textBaseline = "middle";
          c.fillText(L, 0, 1);
          c.restore();
          /* name + equipped title */
          const tl = myTitle();
          c.textBaseline = "alphabetic";
          c.textAlign = "center";
          c.lineWidth = 3;
          c.strokeStyle = "#000";
          c.font = "bold 12px Georgia";
          c.fillStyle = "#fff";
          c.strokeText(pname(), 0, PR + 17);
          c.fillText(pname(), 0, PR + 17);
          c.font = "italic 10px Georgia";
          c.fillStyle = tl.col;
          c.strokeText(tl.n, 0, PR + 29);
          c.fillText(tl.n, 0, PR + 29);
        }
        c.restore();
      }
      function draw(dt) {
        c.setTransform(1, 0, 0, 1, 0, 0);
        c.fillStyle = "#05070a";
        c.fillRect(0, 0, cv.width, cv.height);
        c.setTransform(sc, 0, 0, sc, ox, oy);
        if (shk > 0) {
          shk = Math.max(0, shk - dt);
          const m = shk * shk * 16;
          c.translate(rnd(-m, m), rnd(-m, m));
        }
        c.imageSmoothingEnabled = true;
        c.imageSmoothingQuality = "high";
        c.save();
        c.beginPath();
        c.rect(0, 0, W, H);
        c.clip();
        const ar = S.sc == "arena",
          b = S.b;
        c.drawImage(ar ? IM.arena : IM.hub, 0, 0, W, H);
        if (S.sc == "lobby") {
          c.fillStyle = "#0008";
          c.fillRect(0, 0, W, H);
        }
        if (ar && b && b.ph == 2) {
          c.fillStyle = `rgba(160,0,40,${0.12 + 0.06 * Math.sin(S.tm * 4)})`;
          c.fillRect(0, 0, W, H);
        }
        if (S.sc == "hub") {
          /* portal highlight when the player can enter: soft glow + rising sparks */
          if (nearby() == "portal") {
            const k = 0.5 + 0.5 * Math.sin(S.tm * 6), gl = c.createRadialGradient(PORTAL.x, PORTAL.y - 6, 4, PORTAL.x, PORTAL.y - 6, 80);
            gl.addColorStop(0, `rgba(120,255,235,${0.35 + 0.25 * k})`);
            gl.addColorStop(1, "rgba(60,220,200,0)");
            c.fillStyle = gl;
            c.beginPath();
            c.ellipse(PORTAL.x, PORTAL.y - 6, 80, 60, 0, 0, 6.3);
            c.fill();
            if (Math.random() < 0.3) burst(PORTAL.x + rnd(-30, 30), PORTAL.y + rnd(-10, 14), "#7dffe9", 1, 40);
          }
          const g = 0.5 + 0.5 * Math.sin(S.tm * 3);
          c.strokeStyle = `rgba(90,255,230,${0.4 + 0.4 * g})`;
          c.lineWidth = 3;
          c.beginPath();
          c.ellipse(PORTAL.x, PORTAL.y - 6, 32 + 4 * g, 22 + 3 * g, 0, 0, 6.3);
          c.stroke();
          c.fillStyle = "rgba(60,220,200,.18)";
          c.fill();
          npc(ELDER, V.q >= QUESTS.length ? "" : ["new", "active", "ready"][V.qs]);
          npc(SHOP, "");
          npc(CLASSN, "");
          npc(MAIDEN, V.mb != dayKey(new Date()) ? "bonus" : ""); /* pink marker = free daily blessing ready */
          npc(SMITH, "");
          npc(HERALD, "");
          npc(LORE, V.lbx > Date.now() ? "bonus" : V.lt ? "" : "new");
        }
        for (const z of S.zo) {
          c.fillStyle = "rgba(90,255,140,.18)";
          c.strokeStyle = "#7dff9a";
          c.beginPath();
          c.arc(z.x, z.y, z.r, 0, 6.3);
          c.fill();
          c.stroke();
        }
        for (const a of S.ao) {
          const pr = 1 - Math.max(0, a.t) / a.m;
          c.fillStyle = `rgba(255,40,60,${0.15 + 0.15 * pr})`;
          c.strokeStyle = "#ff5560";
          c.lineWidth = 2;
          c.beginPath();
          c.arc(a.x, a.y, a.r, 0, 6.3);
          c.fill();
          c.stroke();
          c.fillStyle = "rgba(255,90,70,.4)";
          c.beginPath();
          c.arc(a.x, a.y, a.r * pr, 0, 6.3);
          c.fill();
        }
        if (b) {
          const f = b.fl > 0;
          c.save();
          c.translate(b.x, b.y);
          c.shadowColor = b.ph == 2 ? "#f0a" : "#a6f";
          c.shadowBlur = 24;
          c.fillStyle = b.ph == 2 ? "#3a0a22" : "#1b1233";
          c.beginPath();
          c.arc(0, 0, b.r, 0, 6.3);
          c.fill();
          if (b.hf > 0) {
            c.fillStyle = `rgba(255,255,255,${b.hf * 6})`;
            c.fill();
          }
          c.shadowBlur = 0;
          c.strokeStyle = b.ph == 2 ? "#ff4d8d" : "#a78bff";
          c.lineWidth = 3;
          c.stroke();
          c.rotate(S.tm * (b.ph == 2 ? 1.2 : 0.5));
          c.setLineDash([6, 8]);
          c.beginPath();
          c.arc(0, 0, b.r - 8, 0, 6.3);
          c.stroke();
          c.setLineDash([]);
          c.rotate(-S.tm * (b.ph == 2 ? 1.2 : 0.5));
          c.fillStyle = f ? "#fff" : b.ph == 2 ? "#ff4d8d" : "#7aa2ff";
          c.beginPath();
          c.ellipse(-11, -4, 6, 4, 0, 0, 6.3);
          c.ellipse(11, -4, 6, 4, 0, 0, 6.3);
          c.fill();
          if (b.stun > 0) {
            c.strokeStyle = "#ffe066";
            c.lineWidth = 4;
            c.beginPath();
            c.arc(0, 0, b.r + 8, 0, 6.3);
            c.stroke();
          }
          c.restore();
        }
        for (const o of S.pr) {
          c.fillStyle = CL[o.c].col;
          c.shadowColor = CL[o.c].col;
          c.shadowBlur = 8;
          c.beginPath();
          c.arc(o.x, o.y, 5, 0, 6.3);
          c.fill();
          c.shadowBlur = 0;
        }
        /* dash afterimages: fading rings in the class color */
        for (const g of GH) {
          g.l -= dt;
          c.globalAlpha = Math.max(0, g.l / 0.18) * 0.5;
          c.strokeStyle = SKC[g.cls];
          c.lineWidth = 2.5;
          c.beginPath();
          c.arc(g.x, g.y, PR, 0, 6.3);
          c.stroke();
        }
        c.globalAlpha = 1;
        GH = GH.filter((g) => g.l > 0);
        /* level-up shockwave rings */
        for (const r of RINGS) {
          r.t += dt;
          if (r.t < 0) continue;
          c.globalAlpha = Math.max(0, 1 - r.t / 0.6);
          c.strokeStyle = r.col;
          c.lineWidth = 4 * (1 - r.t / 0.6) + 1;
          c.beginPath();
          c.arc(r.x, r.y, 10 + r.t * 160, 0, 6.3);
          c.stroke();
        }
        c.globalAlpha = 1;
        RINGS = RINGS.filter((r) => r.t < 0.6);
        for (const p of S.ps) drawPlayer(p, dt);
        c.save();
        c.globalCompositeOperation = "lighter";
        for (const p of FX) {
          p.l -= dt;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vx *= 0.92;
          p.vy *= 0.92;
          c.globalAlpha = cl(p.l / p.m, 0, 1);
          c.fillStyle = p.col;
          c.beginPath();
          c.arc(p.x, p.y, p.r, 0, 6.3);
          c.fill();
        }
        c.restore();
        FX = FX.filter((p) => p.l > 0);
        c.save();
        c.textAlign = "center";
        c.font = "bold 15px Georgia";
        c.lineWidth = 3;
        c.strokeStyle = "#000";
        for (const f of FT) {
          f.l -= dt;
          f.y -= 38 * dt;
          c.globalAlpha = cl(f.l * 2, 0, 1);
          c.font = `bold ${f.sz || 15}px Georgia`;
          c.fillStyle = f.col;
          c.strokeText(f.t, f.x, f.y);
          c.fillText(f.t, f.x, f.y);
        }
        c.restore();
        FT = FT.filter((f) => f.l > 0);
        c.font = "13px Georgia";
        c.textAlign = "left";
        if (P && S.sc != "lobby") {
          c.fillStyle = "#e6f1ef";
          c.fillText(CL[P.cls].n + "  " + Math.ceil(P.hp) + "/" + P.mh, 14, 24);
          bar(14, 28, 120, 7, P.hp / P.mh, "#48e07a");
          coinHUD(12, 44, V.gold);
          /* tutorial: step text at the top + bouncing arrow over the next target */
          if (S.sc == "hub" && tut() < 4) {
            c.save();
            c.textAlign = "center";
            c.font = 'bold 14px "Cinzel", Georgia';
            c.lineWidth = 3;
            c.strokeStyle = "#000";
            c.fillStyle = "#ffd84a";
            const tx = "TUTORIAL " + (tut() + 1) + "/4 · " + TUT_TXT[tut()];
            c.strokeText(tx, 450, 24);
            c.fillText(tx, 450, 24);
            const tg = [null, ELDER, SHOP, LORE][tut()];
            if (tg) {
              const ay = tg.y - (tg.r || 20) - 34 + Math.sin(S.tm * 6) * 5;
              c.fillStyle = "#ffd84a";
              c.beginPath();
              c.moveTo(tg.x, ay + 10);
              c.lineTo(tg.x - 9, ay - 4);
              c.lineTo(tg.x + 9, ay - 4);
              c.closePath();
              c.fill();
              c.stroke();
            }
            c.restore();
          }
          /* active Archivist blessing, right of the gold counter */
          if (V.bl) {
            const BL = { might: ["⚔ Might", "#ff7a5c"], stone: ["🛡 Stone", "#4da3ff"], swift: ["💨 Swift", "#5ad7ff"] }[V.bl];
            c.save();
            c.font = "bold 12px Georgia";
            c.textAlign = "left";
            c.textBaseline = "middle";
            c.globalAlpha = 0.75 + 0.25 * Math.sin(S.tm * 3);
            c.fillStyle = BL[1];
            c.fillText(BL[0] + " blessing", 116, 59);
            c.restore();
          }
          if (tut() >= 4) qTrack(ar ? 62 : 12);
        }
        if (ar && b) {
          bar(250, 16, 400, 14, b.hp / b.mh, b.ph == 2 ? "#ff4d8d" : "#a78bff");
          c.textAlign = "center";
          c.fillStyle = "#fff";
          c.fillText("Rune Warden  -  Phase " + b.ph + "   " + S.at.toFixed(0) + "s", 450, 46);
          if (b.fl > 0) {
            c.font = "bold 34px Georgia";
            c.fillStyle = "#ff4d8d";
            c.fillText("PHASE 2", 450, 120);
          }
        }
        if (S.end) {
          c.fillStyle = "#000a";
          c.fillRect(0, 230, W, 120);
          c.textAlign = "center";
          c.font = "bold 52px Georgia";
          c.fillStyle = S.end == "win" ? "#7dff9a" : "#ff6070";
          c.fillText(S.end == "win" ? "VICTORY" : "DEFEAT", 450, 300);
          c.font = "15px Georgia";
          c.fillStyle = "#fff";
          c.fillText(
            S.end == "win" ? "+" + coin + " gold  ·  returning to the hub..." : "Returning to the hub...",
            450,
            330,
          );
        }
        if (msgT > 0) {
          msgT -= dt;
          c.textAlign = "center";
          c.font = "bold 16px Georgia";
          c.fillStyle = "#ffd84a";
          c.strokeStyle = "#000";
          c.lineWidth = 3;
          c.strokeText(msg, 450, 560);
          c.fillText(msg, 450, 560);
        }
        c.restore();
      }
      let last = performance.now();
      function loop(now) {
        const dt = Math.min(0.05, (now - last) / 1000);
        last = now;
        padPoll();
        step(dt);
        uiUpd();
        draw(dt);
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
