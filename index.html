<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Runebound</title><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&display=swap"><link rel="icon" type="image/svg+xml" href="assets/icon.svg"><link rel="apple-touch-icon" href="assets/icon.png">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <style>
      :root {
        --bg: #0b0f14;
        --fg: #e6f1ef;
        --pn: #151d26;
        --ln: #2c3b48;
        --ac: #1d7f78;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      :root[data-theme="light"] {
        --bg: #eef1f6;
        --fg: #1a1f2b;
        --pn: #fff;
        --ln: #c4ccdc;
        --ac: #1f8f86;
      }
      :root[data-theme="dark"] {
        --bg: #0b0f14;
        --fg: #e6f1ef;
        --pn: #151d26;
        --ln: #2c3b48;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font:
          14px Georgia,
          serif;
        touch-action: none;
        user-select: none;
        overflow: hidden;
      }
      canvas {
        position: fixed;
        left: 0;
        top: 0;
        width: calc(100% - var(--dw, 0px));
        height: calc(100% - var(--dh, 0px));
      }
      #dlg {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(ellipse at center, #0b1119d9, #000e);
        animation: fade 0.35s ease both;
      }
      [hidden] {
        display: none !important;
      }
      .coin {
        display: inline-block;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        vertical-align: -2px;
        margin-right: 4px;
        background: radial-gradient(circle at 35% 30%, #fff3a8, #f5c518 45%, #b07d00);
        border: 1.5px solid #8a5f00;
        box-shadow: inset 0 0 0 2px #ffe27a55;
      }
      .pn {
        background: var(--pn);
        border: 1px solid var(--ln);
        box-shadow:
          0 10px 40px #000a,
          0 0 0 1px #3fd6c610;
        animation: pop 0.3s ease both;
        border-radius: 12px;
        padding: 14px;
        width: min(440px, 92vw);
        max-height: 90vh;
        overflow: auto;
        touch-action: pan-y;
        user-select: text;
      }
      h2 {
        margin: 0 0 8px;
        font-size: 22px;
        letter-spacing: 0.5px;
        text-shadow: 0 0 14px #3fd6c655;
      }
      button {
        font: inherit;
        padding: 9px 12px;
        margin: 3px;
        border-radius: 8px;
        border: 1px solid var(--ln);
        background: var(--ac);
        color: #fff;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      button {
        transition:
          transform 0.12s ease,
          filter 0.2s ease,
          opacity 0.2s;
      }
      button:not(:disabled):hover {
        filter: brightness(1.12);
      }
      button:not(:disabled):active {
        transform: scale(0.96);
      }
      @keyframes fade {
        from {
          opacity: 0;
        }
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: translateY(8px) scale(0.97);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
      button.alt {
        background: transparent;
        color: var(--fg);
      }
      button img {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        vertical-align: middle;
        margin-right: 5px;
      }
      [hidden] {
        display: none !important;
      }
      .sm {
        font-size: 12px;
        opacity: 0.75;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 6px 0;
        border-top: 1px solid var(--ln);
      }
      .gold {
        color: #d9a400;
        font-weight: bold;
      }
      .qh {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 6px 0 8px;
      }
      .qn {
        font-size: 17px;
        font-weight: bold;
        color: #ffd84a;
        text-shadow: 0 0 10px #ffb30055;
      }
      .qm {
        flex: none;
        display: inline-grid;
        place-items: center;
        width: 18px;
        height: 18px;
        margin: 4px;
        transform: rotate(45deg);
        border: 2px solid #ffd84a;
        background: #120d05;
        box-shadow: 0 0 10px #ffb30099;
      }
      .qm b {
        transform: rotate(-45deg);
        color: #ffd84a;
        font-size: 13px;
      }
      .qm.active {
        border-color: #9aa6b2;
        box-shadow: none;
      }
      .qm.active b {
        color: #9aa6b2;
      }
      .qtag {
        font-size: 11px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: #ffd84a;
        opacity: 0.85;
      }
      .qm.active + div .qtag {
        color: #9aa6b2;
      }
      .qo {
        border-left: 3px solid #ffd84a;
        background: #0005;
        border-radius: 4px;
        padding: 6px 10px;
        margin: 8px 0;
      }
      .qo.done {
        border-color: #7dff9a;
        color: #7dff9a;
      }
      .up {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px;
        margin: 6px 0;
        border: 1px solid var(--ln);
        border-left: 3px solid var(--uc);
        border-radius: 10px;
        background: linear-gradient(90deg, color-mix(in srgb, var(--uc) 16%, transparent), transparent 65%);
      }
      .up img {
        width: 44px;
        height: 44px;
        flex: none;
        filter: drop-shadow(0 0 6px var(--uc));
      }
      .up .nm {
        font-weight: bold;
        color: var(--uc);
      }
      .pips {
        display: inline-flex;
        gap: 4px;
        margin-left: 6px;
        vertical-align: middle;
      }
      .pips i {
        width: 7px;
        height: 7px;
        transform: rotate(45deg);
        border: 1px solid var(--uc);
        display: inline-block;
      }
      .pips i.on {
        background: var(--uc);
        box-shadow: 0 0 6px var(--uc);
      }
      .up button {
        margin-left: auto;
        flex: none;
        background: var(--uc);
        color: #111;
        font-weight: bold;
        min-width: 66px;
        border-color: #0004;
      }
      .purse {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 18px;
        padding: 4px 12px;
        border: 1px solid #ffd84a88;
        border-radius: 20px;
        background: #0006;
      }
      .tt {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 4px;
        border-top: 1px solid var(--ln);
      }
      .tt b {
        color: var(--tc);
      }
      .tt button {
        margin-left: auto;
      }
      .tt.lk {
        opacity: 0.5;
      }
      input.nm {
        font: inherit;
        font-size: 16px;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid var(--ln);
        background: #0006;
        color: var(--fg);
        width: 100%;
        box-sizing: border-box;
        margin: 6px 0 10px;
      }
      /* hub chat: bottom-left panel. Old lines fade out; opening the chat shows the whole log. */
      #chat {
        position: fixed;
        z-index: 12;
        left: 1.4%;
        bottom: 2.5%;
        width: min(340px, 42vw);
        font: 13px Georgia, serif;
        color: #e6f1ef;
        pointer-events: none;
      }
      body.tch #chat { bottom: 34%; }
      #chlog {
        max-height: 150px;
        overflow-y: auto;
        padding: 6px 8px;
        border-radius: 10px;
        scrollbar-width: thin;
      }
      #chlog div {
        margin: 2px 0;
        text-shadow: 0 1px 2px #000, 0 0 4px #000;
        overflow-wrap: anywhere;
        transition: opacity 1.2s;
      }
      #chlog div.old { opacity: 0; }
      #chlog b { font-weight: bold; }
      #chlog .sys { color: #ffd84a; font-style: italic; }
      #chlog .sys.out { color: #7ff0e0; }
      #chlog .sys.bye { color: #9fb0bd; }
      #chat.op #chlog {
        background: #1b2a33d9;
        border: 1px solid #d9a40066;
        pointer-events: auto;
      }
      #chat.op #chlog div.old { opacity: 1; }
      #chrow { display: flex; gap: 6px; margin-top: 6px; align-items: center; }
      #emo { display: flex; gap: 3px; pointer-events: auto; }
      #emo button {
        width: 28px;
        height: 28px;
        padding: 0;
        border-radius: 8px;
        border: 1px solid #d9a40066;
        background: #1b2a33b3;
        font-size: 15px;
        line-height: 1;
        cursor: pointer;
        opacity: 0.75;
        transition: transform 0.12s, opacity 0.2s, border-color 0.2s;
      }
      #emo button:hover { opacity: 1; transform: translateY(-2px) scale(1.08); border-color: #ffd84a; }
      #chin {
        pointer-events: auto;
        flex: 1;
        min-width: 0;
        box-sizing: border-box;
        font: 13px Georgia, serif;
        padding: 7px 10px;
        border-radius: 10px;
        border: 2px solid #d9a40066;
        background: #1b2a33b3;
        color: #e6f1ef;
        outline: none;
        opacity: 0.6;
        transition: opacity 0.2s, border-color 0.2s;
      }
      #chin:focus { opacity: 1; border-color: #ffd84a; background: #1b2a33f0; }
      #chin::placeholder { color: #9fb0bd; font-style: italic; }
      /* top-of-screen HUD buttons: Quests and Guild */
      #btns .hb {
        top: 1.5%;
        width: auto;
        height: 38px;
        border-radius: 10px;
        padding: 0 14px;
        font: bold 13px "Cinzel", Georgia, serif;
        background-color: #1b2a33;
        border-color: #d9a40099;
      }
      #btns #bq { left: calc(50% - 196px); }
      #btns #bg { left: calc(50% - 64px); }
      .net-badge {
        position: absolute; right: 1.4%; top: 52px; max-width: min(220px, 42vw); padding: 8px 11px;
        border: 1px solid var(--gild); border-radius: 9px;
        background: linear-gradient(180deg, #3a2817f2, #24170df2);
        box-shadow: 0 0 0 2px #140c0699, inset 0 1px 0 #ffffff1a, 0 4px 12px #0008;
        color: var(--parch); font: bold 11px "Cinzel", Georgia, serif;
        text-align: center; pointer-events: none; white-space: pre-line; line-height: 1.45;
      }
      .net-code {
        display: block; width: 100%; min-height: 84px; box-sizing: border-box; margin: 6px 0 10px;
        resize: vertical; border: 1px solid var(--ln); border-radius: 8px; padding: 8px;
        background: #0008; color: var(--fg); font: 11px/1.35 Consolas, monospace; overflow-wrap: anywhere;
      }
      .net-hubs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 8px 0; }
      .net-hubs button { margin: 0; padding: 7px 4px; font-size: 12px; }
      .net-status { min-height: 18px; color: var(--gild2); font-size: 12px; }
      /* top-left: gold and Titles on one row, level with the Quests / Guild / Shop buttons */
      #tlbar { position: absolute; left: 1.4%; top: 1.5%; display: flex; gap: 8px; align-items: center; pointer-events: auto; }
      #btns #tlbar #bt { position: static; top: auto; left: auto; height: 38px; }
      #gp {
        display: flex; align-items: center; gap: 6px; height: 38px; box-sizing: border-box; padding: 0 14px 0 10px;
        border-radius: 10px; border: 1px solid var(--gild, #c9a14a);
        background: linear-gradient(180deg, #3a2817f2, #24170df2);
        box-shadow: 0 0 0 2px #140c0699, inset 0 1px 0 #ffffff1a, 0 4px 12px #0008;
        font: bold 15px Georgia, serif; color: #f0c35a; text-shadow: 0 1px 1px #000;
      }
      #gp .coin { width: 18px; height: 18px; margin: 0; }
      /* no visible scrollbars on the side board or the chat log (they still scroll) */
      #board, #chlog { scrollbar-width: none; }
      #board::-webkit-scrollbar, #chlog::-webkit-scrollbar { display: none; }
      #btns #bs { left: calc(50% + 50px); border-color: #ffd84acc; box-shadow: 0 0 10px #ffd84a55; }
      /* cosmetics shop */
      .pn canvas { position: static; width: auto; height: auto; } /* the game canvas rule is position: fixed */
      .pn.shop { width: min(600px, 94vw); padding: 18px 20px 16px; }
      .shead { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
      .shead h2 { margin: 0; }
      .purse2 { font: bold 13px Georgia, serif; color: #ffd84a; background: #0b1218; border: 1px solid #d9a40055; border-radius: 20px; padding: 3px 10px; }
      .ctabs { display: flex; gap: 18px; border-bottom: 1px solid #2c3b48; margin: 10px 0 14px; }
      .ctabs button {
        background: none; border: none; border-radius: 0; margin: 0; padding: 6px 0 8px;
        font: 13px "Cinzel", Georgia, serif; letter-spacing: 1px; color: #9fb0bd;
        border-bottom: 2px solid transparent; margin-bottom: -1px;
      }
      .ctabs button:hover { color: #e6f1ef; }
      .ctabs button.on { color: #ffd84a; border-bottom-color: #ffd84a; }
      .cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
      .ccard {
        position: relative;
        background: #101920;
        border: 1px solid #243240;
        border-radius: 8px;
        padding: 10px 8px 8px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .ccard.paid { border-color: #5a4a1e; }
      .ccard.on { border-color: #ffd84a; }
      .ccard canvas { width: 64px; height: 64px; margin-bottom: 6px; }
      .ccard b { font-size: 13px; line-height: 1.2; }
      .ccard .sub { font-size: 11px; color: #8fa1ae; margin: 3px 0 8px; min-height: 14px; }
      .ccard .tag { position: absolute; top: 6px; right: 6px; font-size: 9px; letter-spacing: 1px; text-transform: uppercase; color: #ffd84a; }
      .ccard button { width: 100%; margin: auto 0 0; padding: 6px 4px; font-size: 12px; background: #1f2e38; border-color: #33475a; }
      .ccard button.gold { background: #3a2f0e; border-color: #8a6d1c; color: #ffe08a; }
      .ccard button.eur { background: #ffd84a; border-color: #ffd84a; color: #1a1406; font-weight: bold; }
      .ccard button:disabled { opacity: 0.55; }
      .cpass {
        display: grid;
        grid-template-columns: 76px 1fr auto;
        gap: 16px;
        align-items: center;
        padding: 14px 16px;
        border: 1px solid #5a4a1e;
        border-radius: 8px;
        background: #13191a;
      }
      .cpass canvas { width: 76px; height: 76px; }
      .cpass h3 { margin: 0 0 6px; font: bold 16px "Cinzel", Georgia, serif; color: #ffd84a; letter-spacing: 1px; }
      .cpass p { margin: 2px 0; font-size: 13px; color: #c9d6de; line-height: 1.45; }
      .cpass button { margin: 0; padding: 10px 16px; background: #ffd84a; border-color: #ffd84a; color: #1a1406; font-weight: bold; white-space: nowrap; }
      .cpass button:disabled { background: #1f2e38; border-color: #33475a; color: #9fb0bd; }
      .cnote { font-size: 12px; color: #ffd84a; min-height: 16px; margin: 10px 0 0; }
      .cfoot { font-size: 11px; color: #6f8291; margin: 4px 0 0; }
      @media (max-width: 520px) { .cpass { grid-template-columns: 60px 1fr; } .cpass button { grid-column: 1 / -1; } }
      /* every dialog: a bit more air and calmer body text */
      .pn { padding: 18px 20px 16px; }
      .pn p { line-height: 1.5; }
      .pn .sm { line-height: 1.45; }
      #btns #bq.hot { box-shadow: 0 0 14px #ffd84a; border-color: #ffd84a; }
      #btns #bt {
        /* under the gold counter (game y ≈ 80 of 600) */
        left: 1.4%;
        top: 13.5%;
        width: auto;
        height: 36px;
        border-radius: 10px;
        padding: 0 12px;
        font-size: 13px;
        background-color: #1b2a33;
        border-color: #d9a40099;
      }
      .dv {
        --dw: min(400px, 38vw);
        --dh: 0px;
      }
      @media (max-width: 760px), (max-aspect-ratio: 1/1) {
        .dv {
          --dw: 0px;
          --dh: 48vh;
        }
      }
      .dv #jz {
        bottom: var(--dh);
      }
      #dev {
        position: fixed;
        z-index: 30;
        right: 0;
        top: 0;
        bottom: 0;
        width: var(--dw);
        box-sizing: border-box;
        background: var(--pn);
        border-left: 2px solid #d9a400;
        padding: 12px;
        padding-top: calc(12px + env(safe-area-inset-top, 0px));
        font-size: var(--df, 15px);
        overflow: auto;
        touch-action: pan-y;
        user-select: text;
      }
      @media (max-width: 760px), (max-aspect-ratio: 1/1) {
        #dev {
          left: 0;
          top: auto;
          width: auto;
          height: var(--dh);
          border-left: 0;
          border-top: 2px solid #d9a400;
        }
      }
      #dev.min {
        left: 6px;
        right: auto;
        top: 50%;
        bottom: auto;
        width: auto;
        height: auto;
        padding: 4px;
        border: 2px solid #d9a400;
        border-radius: 10px;
        overflow: visible;
      }
      #dev button {
        padding: 0.55em 0.8em;
        margin: 3px;
        font-size: 1em;
      }
      #dev input[type="number"] {
        width: 5em;
        font-size: 1em;
        padding: 0.35em;
      }
      #dev select {
        font-size: 1em;
        padding: 0.35em;
        max-width: 100%;
      }
      #dev .row {
        flex-wrap: wrap;
        gap: 6px;
        padding: 8px 0;
      }
      #dev h3 {
        margin: 12px 0 0;
        font-size: 1.05em;
        color: #d9a400;
      }
      #dev label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-right: 12px;
      }
      #dev input[type="checkbox"] {
        width: 1.3em;
        height: 1.3em;
      }
      #dev .hd {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 4px;
        flex-wrap: wrap;
      }
      #btns,
      #jz {
        display: none;
      }
      .g #btns,
      .g #jz {
        display: block;
      }
      /* #btns is a box over the game frame (sized in rs()); clicks pass through it except on buttons */
      #btns {
        position: fixed;
        pointer-events: none;
        z-index: 10;
      }
      #btns button {
        pointer-events: auto;
        position: absolute;
        width: 70px;
        height: 70px;
        border-radius: 50%;
        border: 2px solid #fff8;
        font-size: 11px;
        padding: 0;
        background-color: #24404a;
        text-shadow: 0 1px 2px #000;
      }
      /* dev build board in the left black margin */
      #board {
        position: fixed; left: 10px; top: 10px; bottom: 10px; z-index: 5; overflow: auto; font-size: 12px; color: #cfe;
        background: #0b1218e6; border: 1px solid #2c3b48; border-radius: 10px; padding: 10px; box-sizing: border-box; user-select: text;
      }
      #board.top { left: 10px; right: 10px; top: 6px; bottom: auto; padding: 6px 10px; }
      #board.top .tb { display: none; }
      #board.top ul { columns: 2; column-gap: 24px; }
      #board ul { list-style: none; margin: 6px 0 12px; padding: 0; }
      #board li { padding: 3px 0; border-bottom: 1px solid #1c2832; break-inside: avoid; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      /* crypto-news build feed */
      #board .live { font: bold 12px "Cinzel", Georgia; color: #ff6070; letter-spacing: 2px; display: flex; align-items: center; gap: 6px; }
      #board .dot { width: 8px; height: 8px; border-radius: 50%; background: #ff3b4e; box-shadow: 0 0 8px #ff3b4e; animation: livePulse 1.2s ease-in-out infinite; }
      @keyframes livePulse { 50% { opacity: 0.3; transform: scale(0.7); } }
      #board .ticker { overflow: hidden; white-space: nowrap; margin: 8px -10px; padding: 5px 0; background: #05080c; border-block: 1px solid #1c2832; }
      #board .tkr { display: inline-block; animation: tickerMove 28s linear infinite; }
      #board .tk { margin-right: 26px; font-size: 11px; }
      #board .tk i { color: #8fa3ad; font-style: normal; font-size: 9px; margin-left: 6px; }
      @keyframes tickerMove { to { transform: translateX(-50%); } }
      #board .chips { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin: 6px 0; }
      #board .ver { margin-left: auto; color: #ffd84a; font-size: 12px; letter-spacing: 1px; }
      #board .vnote { font-size: 11px; color: #cfe; margin-top: 3px; }
      #board .cdl { display: flex; align-items: center; gap: 2px; margin-top: 3px; height: 6px; }
      #board .cdl i { display: block; height: 6px; border-radius: 1px; min-width: 2px; }
      #board .cdl .ca { background: #7dff9a; } #board .cdl .cd { background: #ff6070; }
      #board .cdl em { font-style: normal; font-size: 9px; color: #8fa3ad; margin-left: 4px; white-space: nowrap; }
      #board li { white-space: normal !important; }
      #board .chip { background: #0f1a22; border: 1px solid #1c2832; border-radius: 6px; padding: 5px 6px; }
      #board .chip span { display: block; font-size: 8px; color: #8fa3ad; letter-spacing: 1px; }

    <script>
      /* Browser networking block: inputs are hub leases, SDP and game messages; outputs are peer events.
         Edit NETWORK_CONFIG here for deployment. The game owns validation and simulation. */
      (() => {
        "use strict";

        const MAX_CODE_LENGTH = 24000;
        const MAX_MESSAGE_LENGTH = 4096;
        const MAX_MESSAGES_PER_SECOND = 40;
        const NETWORK_CONFIG = Object.freeze({ signalingUrl: "", iceServers: [] });
        const peers = new Map();
        const pendingOffers = new Map();
        let handlers = {};
        let iceServers = [];
        let directoryUrl = "";
        let directorySession = null;

        function randomId() {
          const bytes = crypto.getRandomValues(new Uint8Array(16));
          return Array.from(bytes, (b) => b.toString(16).padStart(2, "0")).join("");
        }

        function encodeCode(value) {
          const bytes = new TextEncoder().encode(JSON.stringify(value));
          let binary = "";
          for (const byte of bytes) binary += String.fromCharCode(byte);
          const code = btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
          if (code.length > MAX_CODE_LENGTH) throw new Error("Connection code is too large.");
          return code;
        }

        function decodeCode(code, expectedType) {
          if (typeof code !== "string" || code.length < 8 || code.length > MAX_CODE_LENGTH) {
            throw new Error("Connection code is invalid or too large.");
          }
          try {
            const base64 = code.replace(/-/g, "+").replace(/_/g, "/");
            const binary = atob(base64 + "=".repeat((4 - (base64.length % 4)) % 4));
            const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0));
            const value = JSON.parse(new TextDecoder().decode(bytes));
            if (!value || value.v !== 1 || value.type !== expectedType || typeof value.token !== "string" ||
                value.token.length > 64 || !value.description || value.description.type !== expectedType ||
                typeof value.description.sdp !== "string" || value.description.sdp.length > 16000) {
              throw new Error("Connection code has an invalid format.");
            }
            return value;
          } catch (error) {
            if (error instanceof Error && error.message === "Connection code has an invalid format.") throw error;
            throw new Error("Could not read the connection code.");
          }
        }

        function makeConnection() {
          if (!window.RTCPeerConnection) throw new Error("This browser does not support WebRTC.");
          return new RTCPeerConnection({ iceServers });
        }

        function configureDirectory(url) {
          if (typeof url !== "string" || !url.trim()) throw new Error("Signaling directory URL is not configured.");
          const parsed = new URL(url.trim());
          if (!["https:", "http:"].includes(parsed.protocol) ||
              (parsed.protocol === "http:" && !["localhost", "127.0.0.1"].includes(parsed.hostname))) {
            throw new Error("The signaling directory must use HTTPS, except for localhost testing.");
          }
          directoryUrl = parsed.href.replace(/\/+$/, "");
        }

        async function directoryRequest(path, body) {
          if (!directoryUrl) throw new Error("Signaling directory URL is not configured.");
          const response = await fetch(directoryUrl + path, {
            method: body === undefined ? "GET" : "POST",
            headers: body === undefined ? undefined : { "content-type": "application/json" },
            body: body === undefined ? undefined : JSON.stringify(body),
            cache: "no-store",
            keepalive: path === "/api/leave",
          });
          let result;
          try { result = await response.json(); }
          catch { throw new Error("Signaling directory returned an invalid response."); }
          if (!response.ok) throw new Error(result.error || `Signaling directory failed (${response.status}).`);
          return result;
        }

        async function directoryJoin(profile) {
          if (!profile || typeof profile !== "object") throw new Error("Player display profile is invalid.");
          const result = await directoryRequest("/api/join", { profile });
          if (!["host", "guest"].includes(result.role) || !Number.isInteger(result.hubId) ||
              typeof result.token !== "string" || result.token.length !== 48 ||
              typeof result.reason !== "string" || result.reason.length > 200 ||
              (result.role === "guest" && typeof result.peerId !== "string")) {
            throw new Error("Signaling directory returned an invalid hub assignment.");
          }
          directorySession = result;
          return { ...result };
        }

        async function directoryPoll() {
          if (!directorySession) throw new Error("No active signaling directory session.");
          return directoryRequest("/api/poll", { token: directorySession.token });
        }

        function directorySend(path, data = {}) {
          if (!directorySession) throw new Error("No active signaling directory session.");
          return directoryRequest(path, { ...data, token: directorySession.token });
        }

        function directoryHeartbeat() {
          return directorySend("/api/heartbeat");
        }

        async function directoryLeave() {
          if (!directorySession) return;
          const session = directorySession;
          directorySession = null;
          await directoryRequest("/api/leave", { token: session.token });
        }

        async function createPeerOffer(peerId) {
          if (typeof peerId !== "string" || !peerId) throw new Error("Peer id is invalid.");
          if (peers.has(peerId)) throw new Error("A connection for this peer already exists.");
          const pc = makeConnection();
          const channel = pc.createDataChannel("runebound", { ordered: true });
          bindPeer(peerId, pc, channel);
          try {
            await pc.setLocalDescription(await pc.createOffer());
            await waitForIce(pc);
            return pc.localDescription;
          } catch (error) {
            const peer = peers.get(peerId);
            if (peer) closePeer(peerId, peer);
            throw error;
          }
        }

        async function createPeerAnswer(peerId, offer) {
          if (typeof peerId !== "string" || !peerId || !offer || offer.type !== "offer" ||
              typeof offer.sdp !== "string" || offer.sdp.length > 16000) throw new Error("Peer offer is invalid.");
          if (peers.has(peerId)) throw new Error("A connection for this peer already exists.");
          const pc = makeConnection();
          pc.ondatachannel = (event) => bindPeer(peerId, pc, event.channel);
          try {
            await pc.setRemoteDescription(offer);
            await pc.setLocalDescription(await pc.createAnswer());
            await waitForIce(pc);
            return pc.localDescription;
          } catch (error) {
            pc.close();
            throw error;
          }
        }

        async function acceptPeerAnswer(peerId, answer) {
          const peer = peers.get(peerId);
          if (!peer || !answer || answer.type !== "answer" || typeof answer.sdp !== "string" || answer.sdp.length > 16000) {
            throw new Error("Peer answer is invalid or no longer expected.");
          }
          await peer.pc.setRemoteDescription(answer);
        }

        function waitForIce(pc, timeoutMs = 18000) {
          if (pc.iceGatheringState === "complete") return Promise.resolve();
          return new Promise((resolve, reject) => {
            const timer = setTimeout(() => {
              pc.removeEventListener("icegatheringstatechange", changed);
              reject(new Error("ICE gathering timed out. Try again on a stable connection."));
            }, timeoutMs);
            function changed() {
              if (pc.iceGatheringState !== "complete") return;
              clearTimeout(timer);
              pc.removeEventListener("icegatheringstatechange", changed);
              resolve();
            }
            pc.addEventListener("icegatheringstatechange", changed);
          });
        }

        function closePeer(id, peer) {
          if (!peer || peer.closed) return;
          peer.closed = true;
          if (peers.get(id) === peer) peers.delete(id);
          peer.channel?.close();
          peer.pc.close();
          handlers.onClose?.(id);
        }

        function bindPeer(id, pc, channel) {
          const peer = { pc, channel, lastSecond: 0, messageCount: 0 };
          peers.set(id, peer);
          channel.onopen = () => handlers.onOpen?.(id);
          channel.onclose = () => closePeer(id, peer);
          channel.onerror = () => handlers.onError?.(id, new Error("Peer data channel failed."));
          channel.onmessage = (event) => {
            if (typeof event.data !== "string" || event.data.length > MAX_MESSAGE_LENGTH) {
              handlers.onError?.(id, new Error("Peer sent an invalid or oversized message."));
              closePeer(id, peer);
              return;
            }
            const now = Date.now();
            if (now - peer.lastSecond >= 1000) {
              peer.lastSecond = now;
              peer.messageCount = 0;
            }
            if (++peer.messageCount > MAX_MESSAGES_PER_SECOND) {
              handlers.onError?.(id, new Error("Peer is sending messages too quickly."));
              closePeer(id, peer);
              return;
            }
            let message;
            try { message = JSON.parse(event.data); }
            catch {
              handlers.onError?.(id, new Error("Peer sent malformed data."));
              closePeer(id, peer);
              return;
            }
            if (!message || typeof message !== "object" || Array.isArray(message) || typeof message.type !== "string") {
              handlers.onError?.(id, new Error("Peer sent an invalid message."));
              closePeer(id, peer);
              return;
            }
            handlers.onMessage?.(id, message);
          };
          pc.onconnectionstatechange = () => {
            if (pc.connectionState === "failed" || pc.connectionState === "closed") closePeer(id, peer);
            else if (pc.connectionState === "disconnected") handlers.onDisconnected?.(id);
          };
        }

        function setHandlers(nextHandlers) {
          handlers = nextHandlers && typeof nextHandlers === "object" ? nextHandlers : {};
        }

        function setIceServers(servers) {
          if (!Array.isArray(servers) || servers.length > 4) throw new Error("Enter an array of up to four ICE servers.");
          iceServers = servers.map((server) => {
            if (!server || typeof server !== "object" || Array.isArray(server)) throw new Error("Each ICE server must be an object.");
            const urls = Array.isArray(server.urls) ? server.urls : [server.urls];
            if (!urls.length || urls.length > 4 || urls.some((url) => typeof url !== "string" || !/^(stun|stuns|turn|turns):/i.test(url))) {
              throw new Error("ICE URLs must use stun:, stuns:, turn:, or turns:.");
            }
            const entry = { urls };
            if (server.username != null) {
              if (typeof server.username !== "string" || server.username.length > 256) throw new Error("ICE username is invalid.");
              entry.username = server.username;
            }
            if (server.credential != null) {
              if (typeof server.credential !== "string" || server.credential.length > 512) throw new Error("ICE credential is invalid.");
              entry.credential = server.credential;
            }
            return entry;
          });
        }

        async function createOffer() {
          const pc = makeConnection();
          const token = randomId();
          const id = "guest-" + token.slice(0, 12);
          const channel = pc.createDataChannel("runebound", { ordered: true });
          bindPeer(id, pc, channel);
          try {
            await pc.setLocalDescription(await pc.createOffer());
            await waitForIce(pc);
            pendingOffers.set(token, id);
            return encodeCode({ v: 1, type: "offer", token, description: pc.localDescription });
          } catch (error) {
            const peer = peers.get(id);
            if (peer) closePeer(id, peer);
            throw error;
          }
        }

        async function createAnswer(offerCode) {
          const offer = decodeCode(offerCode.trim(), "offer");
          const pc = makeConnection();
          const id = "host";
          pc.ondatachannel = (event) => {
            if (peers.has(id)) {
              event.channel.close();
              return;
            }
            bindPeer(id, pc, event.channel);
          };
          try {
            await pc.setRemoteDescription(offer.description);
            await pc.setLocalDescription(await pc.createAnswer());
            await waitForIce(pc);
            return encodeCode({ v: 1, type: "answer", token: offer.token, description: pc.localDescription });
          } catch (error) {
            pc.close();
            throw error;
          }
        }

        async function acceptAnswer(answerCode) {
          const answer = decodeCode(answerCode.trim(), "answer");
          const id = pendingOffers.get(answer.token);
          const peer = peers.get(id);
          if (!id || !peer) throw new Error("That answer does not match an active invite.");
          await peer.pc.setRemoteDescription(answer.description);
          pendingOffers.delete(answer.token);
        }

        function send(id, message) {
          const peer = peers.get(id);
          if (!peer || peer.channel.readyState !== "open") return false;
          const data = JSON.stringify(message);
          if (data.length > MAX_MESSAGE_LENGTH || peer.channel.bufferedAmount > 65536) return false;
          peer.channel.send(data);
          return true;
        }

        function broadcast(message) {
          let sent = 0;
          for (const id of peers.keys()) if (send(id, message)) sent++;
          return sent;
        }

        function disconnect(id) {
          const peer = peers.get(id);
          if (peer) closePeer(id, peer);
        }

        function disconnectAll() {
          for (const [id, peer] of peers) closePeer(id, peer);
          pendingOffers.clear();
        }

        function directoryConfig() {
          return directoryUrl;
        }

          createPeerOffer,

          acceptPeerAnswer,
          createOffer,
          createAnswer,
          acceptAnswer,
          send,
          broadcast,
          disconnect,

      /* rankPool(): the top-100 list. 100 rival guilds made once from a fixed seed (same every time), plus yours. Out: array {name, m, wins, you?}. */
      let RANK_POOL = null;

      /* ---------- Blackjack at the bar (bet gold, beat the Barkeep) ---------- */

      /* ---------- the Barkeep's deck: four suits from this world ----------

      const BJ_SUITS = [

        5: [[-11, -24], [11, -24], [0, 0], [-11, 24], [11, 24]], 6: [[-11, -24], [11, -24], [-11, 0], [11, 0], [-11, 24], [11, 24]],

      /* face cards are people of the hub: Jack the Smith (anvil), Queen the Maiden (rose), King the Elder (wizard hat) */
      const BJ_FACE = { 11: SMITH.g, 12: MAIDEN.g, 13: ELDER.g };
      function bjCardSVG(v, suit) {
        const S2 = BJ_SUITS[suit],

      const BJ_BACK = `<svg class="bjc" viewBox="-31 -43 62 86"><rect x="-30" y="-42" width="60" height="84" rx="6" fill="#163f45" stroke="#8a6d2c" stroke-width="1.5"/>

      function bjUI() {

      const qHead = (st, q, tag) =>

      /* the waterfall's pond feeds a natural stream that winds across the platform and runs under the fountain.

        for (let i = 0; i < 4; i++) {
          const bx = 450 + Math.sin(t * 0.23 + i * 1.6) * 360 + Math.sin(t * 1.1 + i) * 18,
            by = 330 + Math.sin(t * 0.31 + i * 2.4) * 220 + Math.cos(t * 1.4 + i) * 12,
            flap = Math.abs(Math.sin(t * 14 + i * 3)),
            col = ["#ff9fcf", "#ffd84a", "#b48cff", "#8fd8ff"][i];
          c.save();
          c.translate(bx, by);
          c.rotate(Math.sin(t * 0.7 + i) * 0.4);
          c.fillStyle = col;
          for (const s of [-1, 1]) {
            c.beginPath();
            c.ellipse(s * 3.2 * flap, -1.5, 3.6 * flap + 0.6, 2.8, 0, 0, 6.3);
            c.fill();
            c.beginPath();
            c.ellipse(s * 2.4 * flap, 2, 2.4 * flap + 0.4, 1.9, 0, 0, 6.3);
            c.fill();
          }
          c.fillStyle = "#3a2a1a";
          c.fillRect(-0.6, -3, 1.2, 6);
          c.restore();
        }
        /* pollen motes drifting slowly in the warm light */
        c.globalCompositeOperation = "lighter";
        for (let i = 0; i < 14; i++) {
          const px = (i * 73 + t * (4 + (i % 5))) % W,
            py = (i * 151 + Math.sin(t * 0.4 + i) * 30 - t * 3) % H,
            a = 0.25 + 0.25 * Math.sin(t * 2 + i * 1.3);
          c.fillStyle = `rgba(255,245,200,${a})`;
          c.beginPath();
          c.arc(px, (py + H) % H, 1.1, 0, 6.3);
          c.fill();
        }
        c.globalCompositeOperation = "source-over";
        /* a bird gliding across the top every ~20s */
        const cyc = t % 20;
        if (cyc < 6) {
          const p = cyc / 6,
            bx = -40 + p * (W + 80),
            by = 70 + Math.sin(p * 6) * 12,
            wing = Math.sin(t * 10) * 5;
          c.strokeStyle = "rgba(40,40,50,.75)";
          c.lineWidth = 2;
          c.beginPath();
          c.moveTo(bx - 9, by - wing);
          c.quadraticCurveTo(bx - 4, by - 4, bx, by);
          c.quadraticCurveTo(bx + 4, by - 4, bx + 9, by - wing);
          c.stroke();
        }
        c.restore();
      }
      function draw(dt) {
        c.setTransform(1, 0, 0, 1, 0, 0);
        c.fillStyle = "#05070a";
        c.fillRect(0, 0, cv.width, cv.height);
        c.setTransform(sc, 0, 0, sc, ox, oy);
        if (shk > 0) {
          shk = Math.max(0, shk - dt);
          const m = shk * shk * 16;
          c.translate(rnd(-m, m), rnd(-m, m));
        }
        c.imageSmoothingEnabled = true;
        c.imageSmoothingQuality = "high";
        /* camera target: centered on the player, kept inside the island. Lerp (k) makes it lag slightly behind. */
        const vw = W,
          vh = H,
          tx = P ? cl(P.x - vw / 2, 0, W - vw) : (W - vw) / 2,
          ty = P ? cl(P.y - vh / 2, 0, H - vh) : (H - vh) / 2,
          k = 1 - Math.exp(-dt * 10); /* fast, sticky follow */
        CAM.x += (tx - CAM.x) * k;
        CAM.y += (ty - CAM.y) * k;
        c.translate(-CAM.x, -CAM.y);
        c.save();
        c.beginPath();
        c.rect(-1000, -1000, 4000, 4000);
        c.clip();
        const ar = S.sc == "arena",
          b = S.b;
        if (ar) c.drawImage(IM.arena, 0, 0, W, H);
        else {
          /* hub: art is placed in world space (fixed to the 900x600 world, 16:9 kept), so it never moves with the window size */
          drawHub();
        }
        if (S.sc == "lobby") {
          c.fillStyle = "#0008";
          c.fillRect(0, 0, W, H);
        }
        if (ar && b && b.ph == 2) {
          c.fillStyle = `rgba(160,0,40,${0.12 + 0.06 * Math.sin(S.tm * 4)})`;
          c.fillRect(0, 0, W, H);
        }
        if (S.sc == "hub") {
          npc(ELDER, V.q >= QUESTS.length ? "" : ["new", "active", "ready"][V.qs]);
          npc(SHOP, "");
          npc(CLASSN, "");
          npc(MAIDEN, V.mb != dayKey(new Date()) ? "bonus" : ""); /* pink marker = free daily blessing ready */
          npc(SMITH, "");
          npc(HERALD, "");
          npc(BARKEEP, "");
          npc(LORE, V.lbx > Date.now() ? "bonus" : V.lt ? "" : "new");
        }
        for (const z of S.zo) {
          c.fillStyle = "rgba(90,255,140,.18)";
          c.strokeStyle = "#7dff9a";
          c.beginPath();
          c.arc(z.x, z.y, z.r, 0, 6.3);
          c.fill();
          c.stroke();
        }
        for (const a of S.ao) {
          const pr = 1 - Math.max(0, a.t) / a.m;
          c.fillStyle = `rgba(255,40,60,${0.15 + 0.15 * pr})`;
          c.strokeStyle = "#ff5560";
          c.lineWidth = 2;
          c.beginPath();
          c.arc(a.x, a.y, a.r, 0, 6.3);
          c.fill();
          c.stroke();
          c.fillStyle = "rgba(255,90,70,.4)";
          c.beginPath();
          c.arc(a.x, a.y, a.r * pr, 0, 6.3);
          c.fill();
        }
        if (b) {
          const f = b.fl > 0;
          c.save();
          c.translate(b.x, b.y);
          c.shadowColor = b.ph == 2 ? "#f0a" : "#a6f";
          c.shadowBlur = 24;
          c.fillStyle = b.ph == 2 ? "#3a0a22" : "#1b1233";
          c.beginPath();
          c.arc(0, 0, b.r, 0, 6.3);
          c.fill();
          if (b.hf > 0) {
            c.fillStyle = `rgba(255,255,255,${b.hf * 6})`;
            c.fill();
          }
          c.shadowBlur = 0;
          c.strokeStyle = b.ph == 2 ? "#ff4d8d" : "#a78bff";
          c.lineWidth = 3;
          c.stroke();
          c.rotate(S.tm * (b.ph == 2 ? 1.2 : 0.5));
          c.setLineDash([6, 8]);
          c.beginPath();
          c.arc(0, 0, b.r - 8, 0, 6.3);
          c.stroke();
          c.setLineDash([]);
          c.rotate(-S.tm * (b.ph == 2 ? 1.2 : 0.5));
          c.fillStyle = f ? "#fff" : b.ph == 2 ? "#ff4d8d" : "#7aa2ff";
          c.beginPath();
          c.ellipse(-11, -4, 6, 4, 0, 0, 6.3);
          c.ellipse(11, -4, 6, 4, 0, 0, 6.3);
          c.fill();
          if (b.stun > 0) {
            c.strokeStyle = "#ffe066";
            c.lineWidth = 4;
            c.beginPath();
            c.arc(0, 0, b.r + 8, 0, 6.3);
            c.stroke();
          }
          c.restore();
        }
        for (const o of S.pr) {
          c.fillStyle = CL[o.c].col;
          c.shadowColor = CL[o.c].col;
          c.shadowBlur = 8;
          c.beginPath();
          c.arc(o.x, o.y, 5, 0, 6.3);
          c.fill();
          c.shadowBlur = 0;
        }
        /* dash afterimages: fading rings in the class color */
        for (const g of GH) {
          g.l -= dt;
          c.globalAlpha = Math.max(0, g.l / 0.18) * 0.5;
          c.strokeStyle = SKC[g.cls];
          c.lineWidth = 2.5;
          c.beginPath();
          c.arc(g.x, g.y, PR, 0, 6.3);
          c.stroke();
        }
        c.globalAlpha = 1;
        GH = GH.filter((g) => g.l > 0);
        /* level-up shockwave rings */
        for (const r of RINGS) {
          r.t += dt;
          if (r.t < 0) continue;
          c.globalAlpha = Math.max(0, 1 - r.t / 0.6);
          c.strokeStyle = r.col;
          c.lineWidth = 4 * (1 - r.t / 0.6) + 1;
          c.beginPath();
          c.arc(r.x, r.y, 10 + r.t * 160, 0, 6.3);
          c.stroke();
        }
        c.globalAlpha = 1;
        RINGS = RINGS.filter((r) => r.t < 0.6);
        /* hub: you and the visitors, drawn top to bottom so whoever stands lower overlaps the one behind */
        const who = S.sc == "hub" ? S.ps.concat(HUBV).sort((a, b) => a.y - b.y) : S.ps;
        for (const p of who) drawPlayer(p, dt);
        c.save();
        c.globalCompositeOperation = "lighter";
        for (const p of FX) {
          p.l -= dt;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vx *= 0.92;
          p.vy *= 0.92;
          c.globalAlpha = cl(p.l / p.m, 0, 1);
          c.fillStyle = p.col;
          c.beginPath();
          c.arc(p.x, p.y, p.r, 0, 6.3);
          c.fill();
        }
        c.restore();
        FX = FX.filter((p) => p.l > 0);
        c.save();
        c.textAlign = "center";
        c.font = "bold 15px Georgia";
        c.lineWidth = 3;
        c.strokeStyle = "#000";
        for (const f of FT) {
          f.l -= dt;
          f.y -= 38 * dt;
          c.globalAlpha = cl(f.l * 2, 0, 1);
          c.font = `bold ${f.sz || 15}px Georgia`;
          c.fillStyle = f.col;
          c.strokeText(f.t, f.x, f.y);
          c.fillText(f.t, f.x, f.y);
        }
        c.restore();
        FT = FT.filter((f) => f.l > 0);
        camOff(); /* HUD stays fixed on screen */
        c.font = "13px Georgia";
        c.textAlign = "left";
        if (P && S.sc != "lobby") {
          /* no HP readout up here: your health bar floats over your character. Gold lives in the HTML bar (#gp). */
          /* tutorial: step text at the top + bouncing arrow over the next target */
          if (S.sc == "hub" && tut() < TUT_DONE) {
            c.save();
            c.textAlign = "center";
            c.font = 'bold 14px "Cinzel", Georgia';
            c.lineWidth = 3;
            c.strokeStyle = "#000";
            c.fillStyle = "#ffd84a";
            const tx = "TUTORIAL " + (tut() + 1) + "/" + TUT_DONE + " · " + TUT_TXT[tut()];
            c.strokeText(tx, 450, 24);
            c.fillText(tx, 450, 24);
            const tg = [null, CLASSN, ELDER, SHOP, LORE, BARKEEP][tut()];
            if (tg) {
              /* arrow position converted from world to screen-fixed units (HUD transform is active here) */
              const ax = (tg.x - CAM.x),
                ay = (tg.y - (tg.r || 20) - 34 + Math.sin(S.tm * 6) * 5 - CAM.y);
              c.fillStyle = "#ffd84a";
              c.beginPath();
              c.moveTo(ax, ay + 10);
              c.lineTo(ax - 9, ay - 4);
              c.lineTo(ax + 9, ay - 4);
              c.closePath();
              c.fill();
              c.stroke();
            }
            c.restore();
          }
          /* active Archivist blessing, right of the gold counter */
          if (V.bl) {
            const BL = { stone: ["🛡 Stone", "#4da3ff"], swift: ["💨 Swift", "#5ad7ff"] }[V.bl];
            c.save();
            c.font = "bold 12px Georgia";
            c.textAlign = "left";
            c.textBaseline = "middle";
            c.globalAlpha = 0.75 + 0.25 * Math.sin(S.tm * 3);
            c.fillStyle = BL[1];
            c.fillText(BL[0] + " blessing", 14, 62);
            c.restore();
          }
          if (tut() >= TUT_DONE) qTrack(ar ? 62 : 12);
        }
        if (ar && b) {
          bar(250, 16, 400, 14, b.hp / b.mh, b.ph == 2 ? "#ff4d8d" : "#a78bff");
          c.textAlign = "center";
          c.fillStyle = "#fff";
          c.fillText("Rune Warden  -  Phase " + b.ph + "   " + S.at.toFixed(0) + "s", 450, 46);
          if (b.fl > 0) {
            c.font = "bold 34px Georgia";
            c.fillStyle = "#ff4d8d";
            c.fillText("PHASE 2", 450, 120);
          }
        }
        if (S.end) {
          c.fillStyle = "#000a";
          c.fillRect(0, 230, W, 120);
          c.textAlign = "center";
          c.font = "bold 52px Georgia";
          c.fillStyle = S.end == "win" ? "#7dff9a" : "#ff6070";
          c.fillText(S.end == "win" ? "VICTORY" : "DEFEAT", 450, 300);
          c.font = "15px Georgia";
          c.fillStyle = "#fff";
          c.fillText(
            S.end == "win" ? "+" + coin + " gold  ·  returning to the hub..." : "Returning to the hub...",
            450,
            330,
          );
        }
        if (msgT > 0) {
          msgT -= dt;
          c.textAlign = "center";
          c.font = "bold 16px Georgia";
          c.fillStyle = "#ffd84a";
          c.strokeStyle = "#000";
          c.lineWidth = 3;
          c.strokeText(msg, 450, 560);
          c.fillText(msg, 450, 560);
        }
        c.restore();
      }
      let last = performance.now();
      function loop(now) {
        const dt = Math.min(0.05, (now - last) / 1000);
        last = now;
        padPoll();
        step(dt);
        netStep();
        uiUpd();
        draw(dt);
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
